# 웹(przm.web.app) 를 Firebase Hosting 에 배포
# 기본 브랜치에 웹·증강 데이터 변경이 들어오면 자동, 또는 Actions 탭에서 수동 실행(브랜치 선택 가능)
# 회원 서버 주소는 Variables PRISM_SERVER_URL 이 없으면 Cloudflare 계정에서 찾는다 (서버 배포 후 이 워크플로를 한 번 더 돌리면 로그인이 켜진다)
# 필요한 저장소 설정: Secret FIREBASE_SERVICE_ACCOUNT (서비스 계정 JSON 전체), Variables FIREBASE_PROJECT_ID
# 선택: Variables PRISM_SERVER_URL (회원 서버 주소), DISCORD_INVITE_URL, KAKAO_OPENCHAT_URL, APP_DOWNLOAD_URL (Windows 앱 설치 파일 주소)
name: deploy-site

on:
  push:
    branches: [main, claude/new-session-18cxmx]
    paths: ['apps/web/**', 'packages/**', 'firebase.json', 'scripts/fetch-icons.mjs', 'scripts/ci/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

concurrency: deploy-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 설정 확인
        id: cfg
        env:
          FB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FB" ]; then
            echo "::notice::Secret FIREBASE_SERVICE_ACCOUNT 가 아직 없어 배포를 건너뜁니다. docs/deploy-site.md 참고"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.ok == 'true'
        run: npm ci
      - if: steps.cfg.outputs.ok == 'true'
        name: 회원 서버 주소
        id: server
        run: echo "url=$(node scripts/ci/server-url.mjs)" >> "$GITHUB_OUTPUT"
        env:
          PRISM_SERVER_URL: ${{ vars.PRISM_SERVER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.cfg.outputs.ok == 'true'
        run: npm run web:build
        env:
          VITE_PRISM_SERVER: ${{ steps.server.outputs.url }}
          VITE_DISCORD_URL: ${{ vars.DISCORD_INVITE_URL }}
          VITE_KAKAO_URL: ${{ vars.KAKAO_OPENCHAT_URL }}
          VITE_APP_URL: ${{ vars.APP_DOWNLOAD_URL }}
      - if: steps.cfg.outputs.ok == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID || 'prism-90' }}
          channelId: live
