# 회원 서버(Cloudflare Workers + D1) 배포
# server/ 가 바뀐 커밋이 기본 브랜치에 들어오면 자동, 또는 Actions 탭에서 수동 실행
# 처음 한 번 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DISCORD_CLIENT_SECRET
# D1 데이터베이스는 없으면 이 워크플로가 만든다. 배포가 끝나면 서버 주소가 실행 요약(Summary)에 나온다.
name: deploy-server

on:
  push:
    branches: [main, claude/new-session-18cxmx]
    paths: ['server/**', 'scripts/ci/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 설정 확인
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 가 아직 없어 배포를 건너뜁니다. docs/deploy-cloudflare.md 참고"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.ok == 'true'
        run: npm ci
      - if: steps.cfg.outputs.ok == 'true'
        run: npm run build
      - if: steps.cfg.outputs.ok == 'true'
        name: D1 준비 (없으면 만들기)
        run: node scripts/ci/ensure-d1.mjs
      - if: steps.cfg.outputs.ok == 'true'
        name: D1 마이그레이션
        run: npx wrangler d1 migrations apply prism --remote --config server/wrangler.toml
      - if: steps.cfg.outputs.ok == 'true'
        name: Worker 배포
        run: npx wrangler deploy --config server/wrangler.toml
      - if: steps.cfg.outputs.ok == 'true'
        name: 디스코드 비밀값 넣기
        env:
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          if [ -n "$DISCORD_CLIENT_SECRET" ]; then
            printf '%s' "$DISCORD_CLIENT_SECRET" | npx wrangler secret put DISCORD_CLIENT_SECRET --config server/wrangler.toml
          else
            echo "::warning::DISCORD_CLIENT_SECRET 이 없어 디스코드 로그인은 아직 안 됩니다."
          fi
      - if: steps.cfg.outputs.ok == 'true'
        name: 설치 파일 읽기 토큰 넣기 (저장소가 비공개일 때 필요)
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            printf '%s' "$RELEASE_TOKEN" | npx wrangler secret put RELEASE_TOKEN --config server/wrangler.toml
          else
            echo "::notice::RELEASE_TOKEN 이 없습니다. 저장소가 공개인 동안은 괜찮지만, 비공개로 바꾸기 전에 넣어야 앱 업데이트·다운로드가 됩니다."
          fi
      - if: steps.cfg.outputs.ok == 'true'
        name: 멤버 환영 채널 웹훅 넣기 (소개 카드)
        env:
          WELCOME_WEBHOOK_URL: ${{ secrets.WELCOME_WEBHOOK_URL }}
        run: |
          if [ -n "$WELCOME_WEBHOOK_URL" ]; then
            printf '%s' "$WELCOME_WEBHOOK_URL" | npx wrangler secret put WELCOME_WEBHOOK_URL --config server/wrangler.toml
          else
            echo "::notice::WELCOME_WEBHOOK_URL 이 없어 멤버 환영 채널에 소개 카드를 올리지 않습니다 (소개는 저장됨)."
          fi
      - if: steps.cfg.outputs.ok == 'true'
        name: 디스코드 봇 토큰 넣기 + 슬래시 명령 등록
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::notice::DISCORD_BOT_TOKEN 이 없어 봇(매일 공지·슬래시 명령·자동 승급)은 꺼져 있습니다."
            exit 0
          fi
          printf '%s' "$DISCORD_BOT_TOKEN" | npx wrangler secret put DISCORD_BOT_TOKEN --config server/wrangler.toml
          APP=$(grep -E '^DISCORD_CLIENT_ID' server/wrangler.toml | sed -E 's/.*"([0-9]+)".*/\1/')
          GUILD=$(grep -E '^DISCORD_GUILD_ID' server/wrangler.toml | sed -E 's/.*"([0-9]+)".*/\1/')
          # 서버 전용 명령으로 등록 (바로 반영). 같은 목록을 다시 보내도 그대로 덮어쓴다
          code=$(curl -sS -o /tmp/cmds.json -w '%{http_code}' -X PUT "https://discord.com/api/v10/applications/$APP/guilds/$GUILD/commands" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" -H "Content-Type: application/json" --data @server/discord-commands.json)
          if [ "$code" != "200" ]; then echo "::warning::슬래시 명령 등록 실패 ($code): $(head -c 300 /tmp/cmds.json)"; else echo "슬래시 명령 등록 완료"; fi
      - if: steps.cfg.outputs.ok == 'true'
        name: 서버 주소 알리기
        run: |
          URL=$(node scripts/ci/server-url.mjs)
          {
            echo "## 회원 서버"
            echo "- 주소: ${URL:-확인 실패 (Cloudflare 대시보드 → Workers → prism)}"
            echo "- 디스코드 개발자 포털 → OAuth2 → Redirects 에 넣을 주소: \`${URL}/auth/discord/callback\`"
          } >> "$GITHUB_STEP_SUMMARY"
