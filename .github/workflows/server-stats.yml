# 회원 서버 점검 (수동 실행). 개인정보 없이 숫자만 출력한다 (저장소가 공개라 로그도 공개)
name: server-stats

on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: D1 준비
        run: node scripts/ci/ensure-d1.mjs
      - name: 숫자 집계
        run: |
          npx wrangler d1 execute prism --remote --config server/wrangler.toml --command "SELECT
            (SELECT COUNT(*) FROM members) AS members,
            (SELECT COUNT(*) FROM members WHERE riot_puuid IS NOT NULL) AS linked,
            (SELECT COUNT(*) FROM members WHERE opt_in_at IS NOT NULL) AS consent,
            (SELECT COUNT(*) FROM app_tokens) AS tokens,
            (SELECT COUNT(*) FROM matches) AS matches,
            (SELECT COUNT(*) FROM matches WHERE queue_id <> 2400) AS custom,
            (SELECT COUNT(*) FROM matches WHERE crew_count = 0) AS crew0,
            (SELECT COUNT(*) FROM participants) AS participants"
