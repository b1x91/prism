# 회원 서버 점검 (수동 실행). 개인정보 없이 숫자만 출력한다 (저장소가 공개라 로그도 공개)
name: server-stats

on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: D1 준비
        run: node scripts/ci/ensure-d1.mjs
      - name: 숫자 집계
        run: |
          npx wrangler d1 execute prism --remote --config server/wrangler.toml --json --command "
            SELECT 'members' AS k, COUNT(*) AS v FROM members
            UNION ALL SELECT 'members_linked', COUNT(*) FROM members WHERE riot_puuid IS NOT NULL
            UNION ALL SELECT 'members_consent', COUNT(*) FROM members WHERE opt_in_at IS NOT NULL
            UNION ALL SELECT 'app_tokens', COUNT(*) FROM app_tokens
            UNION ALL SELECT 'matches', COUNT(*) FROM matches
            UNION ALL SELECT 'matches_custom', COUNT(*) FROM matches WHERE queue_id <> 2400
            UNION ALL SELECT 'matches_crew0', COUNT(*) FROM matches WHERE crew_count = 0
            UNION ALL SELECT 'participants', COUNT(*) FROM participants
            UNION ALL SELECT 'last_match_age_min', CAST((strftime('%s','now')*1000 - MAX(created_at)) / 60000 AS INTEGER) FROM matches
          "
