# 운영 진단 꺼내기 (수동 실행). 저장소가 공개라 실행 기록·결과물이 누구에게나 보이므로,
# 꺼낸 내용은 실행할 때 넣는 공개 키로 암호화해서만 결과물로 남긴다 (개인 키를 가진 쪽만 풀 수 있다).
# 숫자(몇 건)만 기록에 찍는다.
name: diag-export

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: 'RSA 공개 키 (PEM 을 base64 로, 비우면 .github/diag-pub.pem)'
        required: false
        default: ''
      kind:
        description: '진단 종류 (minimap · partial · overlay-never-shown · ratingdata = 레이팅 비교용 판 기록)'
        required: true
        default: minimap
      limit:
        description: '최근 몇 건'
        required: true
        default: '3'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: D1 준비
        run: node scripts/ci/ensure-d1.mjs
      - name: 꺼내서 암호화
        env:
          PUBKEY: ${{ inputs.pubkey }}
          KIND: ${{ inputs.kind }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          # 최근 3일 진단 기록 수 (종류별, 숫자만)
          npx wrangler d1 execute prism --remote --config server/wrangler.toml --command "SELECT json_extract(body, '$.kind') AS kind, json_extract(body, '$.version') AS ver, COUNT(*) AS n, MAX(at) AS last FROM diag WHERE at > (strftime('%s','now') - 259200) * 1000 GROUP BY 1, 2"
          case "$KIND" in minimap|partial|overlay-never-shown|ratingdata) ;; *) echo "종류가 이상해요"; exit 1;; esac
          case "$LIMIT" in ''|*[!0-9]*) echo "건수가 이상해요"; exit 1;; esac
          if [ "$KIND" = ratingdata ]; then
            # 레이팅 비교용: 판(10명 기록) · 회원 판 · 계정 · 회원 이름 (암호화해서만 남긴다)
            D1="npx wrangler d1 execute prism --remote --config server/wrangler.toml --json --command"
            $D1 "SELECT game_id, played_at, queue_id, players FROM matches ORDER BY played_at" > m.json
            $D1 "SELECT game_id, member_id, puuid, champion_id, team_id, win, played_at FROM participants" > p.json
            $D1 "SELECT puuid, member_id, riot_id, added_at FROM member_accounts" > a.json
            $D1 "SELECT id, nick, riot_puuid FROM members" > u.json
            node -e "const f=require('fs');const o={};for(const k of ['m','p','a','u']){o[k]=JSON.parse(f.readFileSync(k+'.json','utf8'))[0].results;console.log(k,o[k].length)}f.writeFileSync('out.json',JSON.stringify(o))"
            rm -f m.json p.json a.json u.json
          else
          npx wrangler d1 execute prism --remote --config server/wrangler.toml --json \
            --command "SELECT id, member_id, at, body FROM diag WHERE body LIKE '%\"kind\":\"$KIND\"%' ORDER BY at DESC LIMIT $LIMIT" > out.json
          node -e "const r=JSON.parse(require('fs').readFileSync('out.json','utf8'));console.log('건수', (r[0]?.results??[]).length)"
          fi
          if [ -n "$PUBKEY" ]; then echo "$PUBKEY" | base64 -d > pub.pem; else cp .github/diag-pub.pem pub.pem; fi
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in out.json -out out.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in k.txt -out k.enc
          mkdir enc && mv out.enc k.enc enc/
          rm -f out.json k.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diag-enc
          path: enc/
          retention-days: 1
