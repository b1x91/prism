# Windows 앱(Prism.exe 설치 파일) 빌드
# 태그 app-v* 를 올리거나, Actions 탭에서 수동 실행 + "릴리스로 공개" 를 켜면 GitHub Release(app-v<버전>)에 설치 파일을 붙인다.
# 수동 실행에서 끄면 빌드 결과물(Artifacts)로만 남긴다.
# 회원 서버 주소: Variables PRISM_SERVER_URL, 없으면 Cloudflare 계정에서 찾는다 (서버가 없으면 모임 기능 없이 가이드만 동작)
# 설치 파일은 항상 같은 이름(Prism-Setup.exe)으로 올려서 웹의 "앱 받기" 주소가 바뀌지 않게 한다
# 앱 버전은 apps/desktop/src-tauri/tauri.conf.json 의 version
# 공개(릴리스·서버 알림)는 증강 인식 QA(vision-qa: 가상 화면·사진·Windows 문자 인식)가 모두 통과해야 한다 (v3.67)
# 단 Windows 끝단 시험은 지난 공개판 이후 인식 코드·데이터가 바뀌었을 때만 (v3.79)
# "Microsoft Store 판" 을 켜면 PRISM_CHANNEL=store 로 따로 빌드해 MSIX(서명 없음 — 스토어가 서명)를 결과물로 남긴다 (v3.103)
# Secrets MSSTORE_TENANT_ID·MSSTORE_CLIENT_ID·MSSTORE_CLIENT_SECRET·MSSTORE_SELLER_ID 가 있으면 Partner Center 에 새 제출까지 자동 (v3.106)
name: build-desktop

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      release:
        description: 릴리스로 공개 (웹의 "앱 받기"가 이 파일을 받는다)
        type: boolean
        default: true
      store:
        description: Microsoft Store 판(MSIX)도 만들기 — 결과물(prism-msix)을 Partner Center 에 직접 올린다
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # 지난 공개판(app-v*) 이후 인식 코드·증강 데이터가 바뀌었는지 — 안 바뀌었으면 Windows 끝단 시험(문자 인식 설치만 15~20분)을 건너뛴다
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.c.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        shell: bash
        run: |
          last=$(git tag -l 'app-v*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then echo "e2e=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$last" HEAD -- apps/desktop/src-tauri/src/matcher.rs apps/desktop/src-tauri/src/icons.rs apps/desktop/src-tauri/src/vision.rs apps/desktop/qa packages/core/data .github/workflows/vision-qa.yml)
          echo "지난 공개판: $last"; echo "바뀐 인식 관련 파일: ${changed:-없음}"
          if [ -n "$changed" ]; then echo "e2e=yes" >> "$GITHUB_OUTPUT"; else echo "e2e=no" >> "$GITHUB_OUTPUT"; fi

  qa:
    needs: changes
    uses: ./.github/workflows/vision-qa.yml
    with:
      e2e: ${{ needs.changes.outputs.e2e }}

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: 회원 서버 주소
        id: server
        shell: bash
        run: echo "url=$(node scripts/ci/server-url.mjs)" >> "$GITHUB_OUTPUT"
        env:
          PRISM_SERVER_URL: ${{ vars.PRISM_SERVER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run desktop:build
        env:
          PRISM_SERVER: ${{ steps.server.outputs.url }}
      - name: 설치 파일 이름 고정
        shell: bash
        run: cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe Prism-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: prism-windows
          path: Prism-Setup.exe

  # Microsoft Store 판 (MSIX). 앱 안 업데이트는 스토어가, 윈도우 시작 시 실행은 매니페스트의 시작 작업 (store.rs)
  store:
    needs: qa
    if: inputs.store
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: store
      - run: npm ci
      - name: 회원 서버 주소
        id: server
        shell: bash
        run: echo "url=$(node scripts/ci/server-url.mjs)" >> "$GITHUB_OUTPUT"
        env:
          PRISM_SERVER_URL: ${{ vars.PRISM_SERVER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run icons
      - run: npm run tauri -w @prism/desktop -- build --no-bundle
        env:
          PRISM_SERVER: ${{ steps.server.outputs.url }}
          PRISM_CHANNEL: store
      - name: MSIX 묶기
        shell: pwsh
        run: |
          $ver = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version + '.0'
          $stage = 'msix-stage'
          New-Item -ItemType Directory -Force "$stage/Assets" | Out-Null
          $exe = Get-ChildItem apps/desktop/src-tauri/target/release -Filter *.exe | Where-Object { $_.Name -in 'Prism.exe', 'prism-desktop.exe' } | Select-Object -First 1
          if (-not $exe) { throw '실행 파일을 찾지 못했습니다' }
          Copy-Item $exe.FullName "$stage/Prism.exe"
          foreach ($n in 'StoreLogo', 'Square44x44Logo', 'Square71x71Logo', 'Square150x150Logo', 'Square310x310Logo') { Copy-Item "apps/desktop/src-tauri/icons/$n.png" "$stage/Assets/$n.png" }
          Copy-Item apps/desktop/msix/Assets/*.png "$stage/Assets/"
          (Get-Content -Raw -Encoding utf8 apps/desktop/msix/AppxManifest.xml).Replace('__VERSION__', $ver) | Set-Content -Encoding utf8 "$stage/AppxManifest.xml"
          $mk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mk) { throw 'makeappx 를 찾지 못했습니다' }
          & $mk.FullName pack /d $stage /p "Prism-$ver.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx 실패 ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: prism-msix
          path: Prism-*.msix
      # Partner Center 에 새 제출로 올린다 (Secrets MSSTORE_* 가 있을 때만, v3.106). 심사 중인 제출이 있으면 실패한다
      - name: 스토어 자동 제출 준비
        id: msstore
        shell: bash
        env:
          T: ${{ secrets.MSSTORE_TENANT_ID }}
          C: ${{ secrets.MSSTORE_CLIENT_ID }}
          S: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          L: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$C" ] && [ -n "$S" ] && [ -n "$L" ]; then echo "on=yes" >> "$GITHUB_OUTPUT"
          else echo "::notice::MSSTORE_* Secrets 가 없어 스토어 자동 제출을 건너뜁니다 (MSIX 는 결과물로 남음)"; echo "on=no" >> "$GITHUB_OUTPUT"; fi
      - if: steps.msstore.outputs.on == 'yes'
        uses: microsoft/setup-msstore-cli@v1
      - if: steps.msstore.outputs.on == 'yes'
        name: 스토어 자동 제출
        shell: pwsh
        env:
          T: ${{ secrets.MSSTORE_TENANT_ID }}
          C: ${{ secrets.MSSTORE_CLIENT_ID }}
          S: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          L: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          msstore reconfigure --tenantId $env:T --sellerId $env:L --clientId $env:C --clientSecret $env:S
          if ($LASTEXITCODE -ne 0) { throw "msstore 로그인 실패 ($LASTEXITCODE)" }
          $pkg = (Get-ChildItem Prism-*.msix | Select-Object -First 1).FullName
          msstore publish $pkg -id 9N36B7J6KM8R
          if ($LASTEXITCODE -ne 0) { throw "스토어 제출 실패 ($LASTEXITCODE) — 심사 중인 제출이 있으면 끝난 뒤 다시" }

  # QA 와 빌드가 모두 통과해야 공개한다
  publish:
    needs: [qa, windows]
    if: startsWith(github.ref, 'refs/tags/app-v') || inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 지난 공개판 이후 바뀐 것(소식 피드의 앱 업데이트 내용)을 읽으려고
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: prism-windows
      - name: 버전
        id: ver
        run: echo "tag=app-v$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/app-v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          files: Prism-Setup.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Prism 앱 ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || steps.ver.outputs.tag }}
          make_latest: true
      # 서버에 새 버전을 바로 알린다 (GitHub 가 서버의 확인 요청을 막아도 업데이트가 늦지 않게)
      - if: startsWith(github.ref, 'refs/tags/app-v') || inputs.release
        name: 서버에 새 버전 알리기
        # 설치 파일은 이미 올라갔으므로, 여기서 실패해도 빌드 전체를 실패로 만들지 않는다 (서버는 GitHub 로도 새 버전을 찾는다)
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || steps.ver.outputs.tag }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::notice::CLOUDFLARE_API_TOKEN 이 없어 건너뜁니다"; exit 0; }
          [[ "$TAG" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "이상한 태그: $TAG"; exit 1; }
          # 저장소의 wrangler.toml 에는 D1 ID 가 비어 있다 (deploy-server 는 ensure-d1 로 채운다) → 이름으로 찾아 채운다
          ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).find(x=>x.name==='prism');process.stdout.write(d?d.uuid:'')})")
          [ -n "$ID" ] || { echo "::warning::D1 'prism' 을 찾지 못해 건너뜁니다"; exit 0; }
          sed -i "s/database_id = \"[^\"]*\"/database_id = \"$ID\"/" server/wrangler.toml
          npx wrangler d1 execute prism --remote --config server/wrangler.toml --command "INSERT INTO ext_cache (k, v, at) VALUES ('release-tag', '$TAG', $(date +%s)000) ON CONFLICT (k) DO UPDATE SET v = excluded.v, at = excluded.at"
          # 설치 파일의 SHA-256·크기도 함께 (앱이 받은 파일을 확인한 뒤에만 조용히 설치한다)
          SHA=$(sha256sum Prism-Setup.exe | cut -d' ' -f1); SIZE=$(stat -c %s Prism-Setup.exe)
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::warning::SHA-256 계산 실패"; exit 0; }
          npx wrangler d1 execute prism --remote --config server/wrangler.toml --command "INSERT INTO ext_cache (k, v, at) VALUES ('release-file', '{\"tag\":\"$TAG\",\"sha256\":\"$SHA\",\"size\":$SIZE}', $(date +%s)000) ON CONFLICT (k) DO UPDATE SET v = excluded.v, at = excluded.at"
          # 소식 피드 '앱 업데이트' 카드에 쓸 바뀐 점: 저장소의 release-notes.json (사람이 고른 회원이 체감할 것만, v3.123). 3줄 미만이면 서버가 올리지 않는다
          TAG="$TAG" node -e "const fs=require('fs');let notes=[];try{notes=(JSON.parse(fs.readFileSync('release-notes.json','utf8')).notes||[]).map(s=>String(s).trim()).filter(Boolean).slice(0,8)}catch{};const v=JSON.stringify({tag:process.env.TAG,notes}).replace(/'/g,\"''\");fs.writeFileSync('notes.sql','INSERT INTO ext_cache (k, v, at) VALUES (\\'release-notes\\', \\''+v+'\\', '+Date.now()+') ON CONFLICT (k) DO UPDATE SET v = excluded.v, at = excluded.at;')"
          npx wrangler d1 execute prism --remote --config server/wrangler.toml --file notes.sql || echo "::warning::바뀐 점 기록 실패 (소식 카드는 버전만)"
