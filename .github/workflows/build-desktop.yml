# Windows 앱(Prism.exe 설치 파일) 빌드
# 태그 app-v* 를 올리면 GitHub Release 에 설치 파일을 붙인다. Actions 탭에서 수동 실행하면 빌드 결과물(Artifacts)로만 남긴다.
# 회원 서버 주소: Variables PRISM_SERVER_URL, 없으면 Cloudflare 계정에서 찾는다 (서버가 없으면 모임 기능 없이 가이드만 동작)
# 설치 파일은 항상 같은 이름(Prism-Setup.exe)으로 올려서 웹의 "앱 받기" 주소가 바뀌지 않게 한다
# 앱 버전은 apps/desktop/src-tauri/tauri.conf.json 의 version
name: build-desktop

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: 회원 서버 주소
        id: server
        shell: bash
        run: echo "url=$(node scripts/ci/server-url.mjs)" >> "$GITHUB_OUTPUT"
        env:
          PRISM_SERVER_URL: ${{ vars.PRISM_SERVER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run desktop:build
        env:
          PRISM_SERVER: ${{ steps.server.outputs.url }}
      - name: 설치 파일 이름 고정
        shell: bash
        run: cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe Prism-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: prism-windows
          path: Prism-Setup.exe
      - if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: Prism-Setup.exe
          name: Prism 앱 ${{ github.ref_name }}
