# Windows 앱(Prism.exe 설치 파일) 빌드
# 태그 app-v* 를 올리면 GitHub Release 에 설치 파일을 붙인다. Actions 탭에서 수동 실행하면 빌드 결과물(Artifacts)로만 남긴다.
# 필요한 저장소 설정: Variables PRISM_SERVER_URL (회원 서버 주소. 없으면 모임 기능 없이 가이드만 동작)
# 앱 버전은 apps/desktop/src-tauri/tauri.conf.json 의 version
name: build-desktop

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run desktop:build
        env:
          PRISM_SERVER: ${{ vars.PRISM_SERVER_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: prism-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          name: Prism 앱 ${{ github.ref_name }}
