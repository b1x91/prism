<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Prism</title>
<link rel="icon" href="/brand/prism-32.png" />
<style>
/* ───────── 글꼴: Pretendard (앱에 포함, 인터넷 없이도 같은 글꼴) ───────── */
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-style: normal; font-display: swap; src: url(/fonts/PretendardVariable.woff2) format("woff2-variations"), url(/fonts/PretendardVariable.woff2) format("woff2"); }

/* ───────── 토큰 ───────── */
:root {
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 48px;
  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-pill: 999px;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px; --fs-2xl: 28px;
  --sidebar: 232px; --content: 920px;

  --bg: #f4f4f1; --bg-elev: #fafaf8; --surface: #ffffff; --surface-2: #f3f3ef; --surface-3: #e9e9e3;
  --border: rgba(20, 24, 40, .08); --border-strong: rgba(20, 24, 40, .16);
  --text: #141826; --text-2: #4f566b; --text-3: #8b90a3;
  --accent: #3a66f0; --accent-soft: rgba(58, 102, 240, .10); --on-accent: #fff;
  --win: #2f6fe4; --lose: #e0484d; --ok: #1f9d63; --warn: #b7791f;
  --silver: #a3a8b3; --gold: #c99a1e;
  --shadow: 0 1px 2px rgba(16, 20, 36, .04), 0 8px 24px rgba(16, 20, 36, .06);

  --spectrum-1: #ff3d6e; --spectrum-2: #ff8a1f; --spectrum-3: #ffd21f; --spectrum-4: #2fd36b;
  --spectrum-5: #1fc8ff; --spectrum-6: #3d6bff; --spectrum-7: #b042ff;
  --spectrum: linear-gradient(90deg, var(--spectrum-1), var(--spectrum-2), var(--spectrum-3), var(--spectrum-4), var(--spectrum-5), var(--spectrum-6), var(--spectrum-7));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0d18; --bg-elev: #0d1120; --surface: #121728; --surface-2: #181e33; --surface-3: #212842;
    --border: rgba(160, 172, 214, .09); --border-strong: rgba(160, 172, 214, .18);
    --text: #eef1f8; --text-2: #a9b0c6; --text-3: #6d7491;
    --accent: #6c93ff; --accent-soft: rgba(108, 147, 255, .14); --on-accent: #0a0d18;
    --win: #5b93ff; --lose: #ff6a6f; --ok: #3ccf8e; --warn: #f2b54c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  --bg: #0a0d18; --bg-elev: #0d1120; --surface: #121728; --surface-2: #181e33; --surface-3: #212842;
  --border: rgba(160, 172, 214, .09); --border-strong: rgba(160, 172, 214, .18);
  --text: #eef1f8; --text-2: #a9b0c6; --text-3: #6d7491;
  --accent: #6c93ff; --accent-soft: rgba(108, 147, 255, .14); --on-accent: #0a0d18;
  --win: #5b93ff; --lose: #ff6a6f; --ok: #3ccf8e; --warn: #f2b54c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .25);
}

/* ───────── 기본 ───────── */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 400 var(--fs-md)/1.55 "Pretendard Variable", Pretendard, system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
img { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ───────── 로고 ───────── */
.gem { position: relative; width: var(--size, 28px); height: var(--size, 28px); flex: none; }
.gem img { width: 100%; height: 100%; filter: drop-shadow(0 2px 8px rgba(80, 140, 255, .35)); }
.gem::after { /* 보석 모양 안에서만 지나가는 빛 */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .85) 50%, transparent 65%) no-repeat;
  background-size: 250% 100%; background-position: 150% 0;
  -webkit-mask: url(/brand/prism-128.png) center / contain no-repeat; mask: url(/brand/prism-128.png) center / contain no-repeat;
  animation: shine 5s ease-in-out infinite; mix-blend-mode: overlay;
}
.gem.float { animation: float 4s ease-in-out infinite; }
@keyframes shine { 0%, 62% { background-position: 150% 0; } 85%, 100% { background-position: -60% 0; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .gem::after, .gem.float, .live::before { animation: none !important; } }

/* ───────── 뼈대 ───────── */
.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: var(--s6); padding: var(--s6) var(--s4); background: var(--bg-elev); border-right: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s2); }
.brand b { font-size: var(--fs-lg); font-weight: 750; letter-spacing: .01em; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: var(--s3); height: 40px; padding: 0 var(--s3); border-radius: var(--r-m); color: var(--text-2); font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.side-foot { margin-top: auto; display: grid; gap: var(--s3); padding: 0 var(--s2); }
.who { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .sub { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.main { min-width: 0; padding: var(--s7) var(--s7) var(--s8); }
.page { max-width: var(--content); margin: 0 auto; display: grid; gap: var(--s4); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s2); flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: var(--fs-2xl); font-weight: 750; letter-spacing: -.01em; line-height: 1.2; }
.page-head p { margin: var(--s1) 0 0; color: var(--text-2); font-size: var(--fs-sm); }
.topbar, .tabbar { display: none; }

@media (max-width: 959px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .topbar { display: flex; align-items: center; gap: var(--s3); position: sticky; top: 0; z-index: 5; height: 56px; padding: 0 var(--s4); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .topbar b { font-weight: 750; }
  .topbar .icon-btn { margin-left: auto; }
  .main { padding: var(--s5) var(--s4) calc(80px + env(safe-area-inset-bottom)); }
  .page-head h1 { font-size: var(--fs-xl); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; inset: auto 0 0 0; z-index: 5; padding-bottom: env(safe-area-inset-bottom); background: color-mix(in srgb, var(--bg-elev) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--border); }
  .tabbar a { position: relative; display: grid; justify-items: center; gap: 2px; padding: var(--s2) 0; font-size: 11px; color: var(--text-3); }
  .tabbar a.on { color: var(--text); font-weight: 600; }
  .tabbar svg { width: 20px; height: 20px; }
  .tabbar .count { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; }
}

/* ───────── 컴포넌트 ───────── */
.grid { display: grid; gap: var(--s4); }
.g2 { grid-template-columns: 1fr; } .g3 { grid-template-columns: 1fr; } .g4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 720px) { .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); } .g-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-l); padding: var(--s5); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); min-height: 24px; }
.card-title { margin: 0; font-size: var(--fs-md); font-weight: 650; display: flex; align-items: center; gap: var(--s2); }
.meta { font-size: var(--fs-xs); color: var(--text-3); }
.sub { font-size: var(--fs-xs); color: var(--text-2); }

.stat { display: grid; gap: var(--s1); }
.stat .label { font-size: var(--fs-xs); color: var(--text-3); }
.stat .value { font-size: var(--fs-xl); font-weight: 700; line-height: 1.2; }
.stat .value small { font-size: var(--fs-sm); font-weight: 500; color: var(--text-3); margin-left: 2px; }

.list { display: grid; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid var(--border); }
.item:first-child { border-top: 0; padding-top: 0; } .item:last-child { padding-bottom: 0; }
.item .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .end { text-align: right; }

.av { width: 40px; height: 40px; border-radius: var(--r-m); background: var(--surface-3); object-fit: cover; flex: none; }
.av.s { width: 28px; height: 28px; border-radius: var(--r-s); }
.av.l { width: 56px; height: 56px; border-radius: var(--r-l); }
.initial { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-pill); font-size: var(--fs-sm); font-weight: 700; color: #fff; flex: none; }

.chips { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 4px; border-radius: var(--r-pill); background: var(--surface-2); font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; }
.chip img { width: 18px; height: 18px; border-radius: 50%; }
.chip.noicon { padding-left: 10px; }
.chip em { font-style: normal; color: var(--text-3); }
.chip.r-silver { box-shadow: inset 0 0 0 1px var(--silver); } .chip.r-gold { box-shadow: inset 0 0 0 1px var(--gold); }
.chip.r-prism::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--spectrum); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 600; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: 36px; padding: 0 var(--s4); border-radius: var(--r-m); border: 1px solid var(--border-strong); background: var(--surface); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { height: 28px; padding: 0 var(--s3); font-size: var(--fs-xs); border-radius: var(--r-s); }
.icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-m); border: 0; background: transparent; color: var(--text-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }
.input { height: 36px; padding: 0 var(--s3); border-radius: var(--r-m); border: 1px solid var(--border-strong); background: var(--surface); min-width: 0; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-m); background: var(--surface-2); }
.seg button { height: 30px; padding: 0 var(--s3); border: 0; border-radius: 10px; background: transparent; font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.empty { display: grid; justify-items: center; gap: var(--s3); padding: var(--s7) var(--s4); text-align: center; color: var(--text-2); font-size: var(--fs-sm); }
.empty .gem { --size: 40px; opacity: .9; }
.empty.compact { padding: var(--s5) var(--s3); }

.wl { font-weight: 650; } .w { color: var(--win); } .l { color: var(--lose); }
.bar { height: 6px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--win); }

/* 최근 10판: 왼쪽 요약 + 오른쪽 일러스트 카드 10장 (왼쪽이 최근) */
.r10 { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: var(--s5); align-items: center; }
.r10-sum { display: grid; gap: var(--s1); align-content: center; padding-right: var(--s5); border-right: 1px solid var(--border); height: 100%; }
.r10-sum .label { font-size: var(--fs-xs); color: var(--text-3); }
.r10-sum .big { font-size: var(--fs-2xl); font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
.r10-sum .wl-line { font-size: var(--fs-sm); color: var(--text-2); }
.r10-sum .meta { margin-top: var(--s2); }
.r10-row { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: var(--s2); }
.r10-g { position: relative; isolation: isolate; display: flex; flex-direction: column; justify-content: space-between; aspect-ratio: 3 / 4; padding: 6px; border-radius: var(--r-m); overflow: hidden; background: #0b0e1a; color: #fff; text-decoration: none; }
.r10-g img { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; transition: transform .4s ease; }
.r10-g::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to bottom, rgba(6, 8, 18, .1) 30%, rgba(6, 8, 18, .85)); }
.r10-g.is-l img { filter: saturate(.35) brightness(.7); }
.r10-g:hover img { transform: scale(1.06); }
.r10-g .res { align-self: flex-start; height: 18px; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; }
.r10-g.is-w .res { background: var(--win); } .r10-g.is-l .res { background: rgba(255, 255, 255, .18); color: rgba(255, 255, 255, .85); }
.r10-g.is-w { box-shadow: inset 0 -3px 0 var(--win); }
.r10-g .kda { font-size: 10px; font-weight: 600; letter-spacing: -.02em; text-align: center; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r10-g.none { background: transparent; border: 1px dashed var(--border-strong); }
.r10-g.none::after { display: none; }
@media (max-width: 720px) {
  .r10 { grid-template-columns: 1fr; gap: var(--s4); }
  .r10-sum { grid-template-columns: auto auto 1fr; align-items: baseline; gap: var(--s3); padding: 0 0 var(--s4); border-right: 0; border-bottom: 1px solid var(--border); }
  .r10-sum .label { display: none; }
  .r10-sum .meta { margin: 0; justify-self: end; }
  .r10-row { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .r10-g img { transition: none; } .r10-g:hover img { transform: none; } }

/* 판 */
.game { display: grid; grid-template-columns: 3px 40px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s3) 0; border-top: 1px solid var(--border); }
.game:first-child { border-top: 0; padding-top: 0; }
.game .edge { align-self: stretch; border-radius: 2px; }
.game.is-w .edge { background: var(--win); } .game.is-l .edge { background: var(--lose); }
.game .line { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
.game .chips { margin-top: 6px; }
.game .end { display: grid; justify-items: end; gap: 6px; }
.items { display: flex; gap: 3px; }
.items img, .items span { width: 22px; height: 22px; border-radius: 5px; background: var(--surface-3); }
@media (max-width: 600px) { .game { grid-template-columns: 3px 40px minmax(0, 1fr); } .game .end { grid-column: 3; justify-items: start; } }

/* 챔프 선택: 내 챔피언과 벤치를 나란히 놓고 비교. 카드는 일러스트를 배경으로 깐 어두운 카드 (테마와 무관) */
.cs { display: grid; gap: var(--s5); }
.cs-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s3); }
.cs-guide { font-size: var(--fs-sm); color: var(--text-2); }
.cs-guide b { color: var(--text); font-weight: 600; }
.cs-mates { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s5); font-size: var(--fs-sm); color: var(--text-2); }
.cs-mates .label { font-size: var(--fs-xs); color: var(--text-3); margin-right: var(--s1); }
.mate { display: inline-flex; align-items: center; gap: var(--s2); }
.mate b { color: var(--text); font-weight: 600; }
.mate .initial { width: 20px; height: 20px; font-size: 10px; }
.mate .wl { color: var(--accent); }
.cs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: var(--s3); }
.cs-tile {
  --text: #f1f3f9; --text-2: rgba(241, 243, 249, .8); --text-3: rgba(241, 243, 249, .58);
  --surface-2: rgba(255, 255, 255, .1); --surface-3: rgba(255, 255, 255, .16); --border: rgba(255, 255, 255, .12);
  position: relative; isolation: isolate; display: flex; flex-direction: column; padding-top: 168px; /* 일러스트 영역을 고정해 카드끼리 줄이 맞도록 */
  border-radius: var(--r-l); overflow: hidden; background: #0b0e1a; border: 1px solid var(--border); color: var(--text); min-width: 0;
}
.cs-tile.mine { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cs-bg { position: absolute; inset: 0; z-index: -2; }
.cs-bg img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; transition: transform .6s ease; }
.cs-tile:hover .cs-bg img { transform: scale(1.04); }
.cs-tile::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to bottom, rgba(6, 8, 18, 0) 0, rgba(6, 8, 18, .25) 110px, rgba(6, 8, 18, .88) 230px, rgba(6, 8, 18, .96) 100%); }
.cs-best { position: absolute; top: var(--s3); left: var(--s3); height: 24px; padding: 0 10px; border-radius: var(--r-pill); background: rgba(6, 8, 18, .7); color: #fff; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(6px); }
.cs-best img { width: 12px; height: 12px; }
.cs-name { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s5); }
.cs-name b { font-size: var(--fs-xl); font-weight: 750; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0, 0, 0, .5); }
.cs-name span { height: 20px; padding: 0 8px; border-radius: var(--r-pill); background: rgba(255, 255, 255, .16); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; }
.cs-tile.mine .cs-name span { background: var(--accent); color: var(--on-accent); }
.cs-body { display: grid; gap: var(--s5); padding: var(--s4) var(--s5) var(--s5); }
.cs-stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.cs-stat { display: grid; gap: 2px; }
.cs-stat .k { font-size: var(--fs-xs); color: var(--text-3); }
.cs-stat .v { font-size: var(--fs-xl); font-weight: 750; line-height: 1.2; }
.cs-stat .v.none { color: var(--text-3); font-weight: 500; }
.cs-stat .n { font-size: var(--fs-xs); color: var(--text-3); }
.cs-augs { display: grid; gap: 6px; }
.cs-augs .head { font-size: var(--fs-xs); color: var(--text-3); }
.cs-augs .row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-width: 0; }
.cs-augs .row .chip { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cs-master { display: flex; align-items: center; gap: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--border); font-size: var(--fs-xs); color: var(--text-2); }
.cs-master .initial { width: 20px; height: 20px; font-size: 10px; }
.cs-more { border: 0; background: none; padding: 0; color: var(--accent); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }
.cs-more:hover { text-decoration: underline; }
.cs-tip { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-m); background: var(--surface-2); font-size: var(--fs-sm); color: var(--text-2); }
.cs-tip b { color: var(--text); font-weight: 600; white-space: nowrap; }
@media (max-width: 600px) { .cs-tile { padding-top: 140px; } }
@media (prefers-reduced-motion: reduce) { .cs-bg img { transition: none; } .cs-tile:hover .cs-bg img { transform: none; } }

/* 챔프 선택 배치: 왼쪽 큰 카드(내 챔피언 또는 미리보기), 오른쪽 벤치 패널 */
.cs-layout { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: var(--s5); align-items: stretch; }
/* 벤치 패널은 높이를 차지하지 않고(절대 배치) 큰 카드 높이만큼만 늘어난다. 넘치면 목록 안에서 스크롤 */
.cs-bench-wrap { position: relative; min-width: 0; }
.cs-bench-wrap > .cs-bench { position: absolute; inset: 0; }
@media (max-width: 860px) {
  .cs-layout { grid-template-columns: 1fr; }
  .cs-bench-wrap > .cs-bench { position: static; }
  .cs-bench-wrap .cs-bench-list { flex: none; max-height: 360px; } /* 한 열일 때는 기준 카드가 없으므로 자체 최대 높이 */
}
.cs-back { position: absolute; top: var(--s3); right: var(--s3); height: 26px; padding: 0 10px; border: 0; border-radius: var(--r-pill); background: rgba(6, 8, 18, .7); color: #fff; font-size: 11px; font-weight: 600; cursor: pointer; backdrop-filter: blur(6px); }
.cs-bench { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; min-height: 0; }
/* 벤치 목록: 패널 남은 높이를 채우고 넘치면 안에서 스크롤, 아래쪽은 흐리게 */
.cs-bench-list { flex: 1 1 0; min-height: 0; display: grid; align-content: start; gap: 6px; overflow-y: auto; padding-right: 2px; padding-bottom: var(--s5);
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent); }
/* 벤치 머리줄: 왼쪽 안내, 오른쪽 정렬 버튼 */
.cs-bench-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); position: relative; }
.cs-sort { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: var(--r-s); background: transparent; color: var(--text-2); font-size: var(--fs-xs); font-weight: 600; cursor: pointer; }
.cs-bench-title { font-size: var(--fs-sm); color: var(--text-2); }
.cs-bench-title b { color: var(--text); font-weight: 650; margin-left: 2px; }
.cs-sort:hover, .cs-sort[aria-expanded="true"] { color: var(--text); background: var(--surface-2); }
.cs-sort svg { width: 14px; height: 14px; }
.cs-sort-menu { position: absolute; z-index: 10; top: 34px; right: 0; min-width: 220px; padding: 4px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow); display: grid; }
.cs-sort-menu button { display: grid; grid-template-columns: 16px 1fr; gap: var(--s2); align-items: start; padding: 8px 10px; border: 0; border-radius: var(--r-s); background: none; text-align: left; cursor: pointer; }
.cs-sort-menu button:hover { background: var(--surface-2); }
.cs-sort-menu svg { width: 14px; height: 14px; margin-top: 3px; color: var(--accent); }
.cs-sort-menu b { display: block; font-size: var(--fs-sm); font-weight: 600; }
.cs-sort-menu small { display: block; font-size: var(--fs-xs); color: var(--text-3); }

/* 안 A: 일러스트 타일 격자 */
.cb-tiles { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); grid-auto-rows: 120px; gap: var(--s3); } /* 행 높이 고정: 목록 높이 제한과 충돌하지 않게 */
.cb-tile { position: relative; isolation: isolate; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding: 10px; border: 0; border-radius: var(--r-m); overflow: hidden; background: #0b0e1a; color: #fff; text-align: left; cursor: pointer; outline: 2px solid transparent; outline-offset: -2px; }
.cb-tile img.art { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; filter: saturate(.65) brightness(.75); transition: transform .4s ease, filter .3s ease; }
.cb-tile:hover img.art, .cb-tile.on img.art { filter: none; }
.cb-tile::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to bottom, rgba(6, 8, 18, 0) 40%, rgba(6, 8, 18, .85)); }
.cb-tile:hover img.art { transform: scale(1.04); }
.cb-tile.on { outline-color: var(--accent); }
.cb-tile .nm { font-size: var(--fs-sm); font-weight: 650; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
.cb-tile .rt { margin-top: 2px; font-size: 11px; color: rgba(255, 255, 255, .7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb-tile .rt b { color: #fff; font-weight: 700; }
.cb-tile .gem-mark { position: absolute; top: 8px; left: 8px; width: 14px; height: 14px; }
@media (prefers-reduced-motion: reduce) { .cb-tile img.art { transition: none; } .cb-tile:hover img.art { transform: none; } }

/* 안 B: 촘촘한 표 */
.cb-table { gap: 0; }
.cb-head, .cb-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 92px 92px; gap: var(--s3); align-items: center; }
.cb-head { padding: 0 var(--s2) 6px; font-size: 11px; color: var(--text-3); border-bottom: 1px solid var(--border); }
.cb-head span:first-child { grid-column: 1 / 3; }
.cb-row { width: 100%; height: 40px; padding: 0 var(--s2); border: 0; border-bottom: 1px solid var(--border); background: none; text-align: left; cursor: pointer; }
.cb-row:hover { background: var(--surface-2); }
.cb-row.on { background: var(--accent-soft); }
.cb-row .av { width: 28px; height: 28px; border-radius: 7px; }
.cb-row .nm { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-sm); font-weight: 600; }
.cb-row .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb-row .nm img { width: 13px; height: 13px; flex: none; }
.cb-meter { display: grid; grid-template-columns: 1fr 34px; gap: 6px; align-items: center; }
.cb-meter .bar { height: 4px; }
.cb-meter b { font-size: var(--fs-xs); font-weight: 700; text-align: right; }
.cb-meter b.none { color: var(--text-3); font-weight: 500; }

/* 도감 */
.toolbar { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.toolbar .input { flex: 1; min-width: 140px; }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: var(--s2); }
.dex button { display: grid; justify-items: center; gap: 6px; padding: var(--s3) var(--s1); border: 1px solid transparent; border-radius: var(--r-m); background: transparent; cursor: pointer; min-width: 0; }
.dex button:hover { background: var(--surface-2); border-color: var(--border); }
.dex .av { width: 48px; height: 48px; }
.dex .name { font-size: var(--fs-xs); font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dex .rec { font-size: 11px; color: var(--text-3); }
.dex .no .av { filter: grayscale(1); opacity: .3; } .dex .no .name { color: var(--text-3); font-weight: 500; }
.progress { display: flex; align-items: center; gap: var(--s3); }
.progress .bar { flex: 1; height: 8px; } .progress .bar > span { background: var(--accent); }

/* 기록 카드 */
.record { position: relative; display: grid; gap: var(--s1); padding: var(--s4); border-radius: var(--r-m); background: var(--surface-2); min-width: 0; }
.record .value { font-size: var(--fs-xl); font-weight: 750; }
.record .label { display: flex; align-items: center; gap: 6px; }
.record .label .gem { --size: 14px; }
.record .label .gem img { filter: none; }

/* 시트 (챔피언 상세) */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(5, 8, 16, .45); backdrop-filter: blur(2px); }
.sheet { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); overflow-y: auto; background: var(--bg-elev); border-left: 1px solid var(--border); box-shadow: var(--shadow); padding: var(--s6); display: grid; align-content: start; gap: var(--s6); }
.sheet-head { display: flex; align-items: center; gap: var(--s4); }
.sheet-head h2 { margin: 0; font-size: var(--fs-xl); font-weight: 750; }
.sheet-head .icon-btn { margin-left: auto; }
.section-title { margin: 0 0 var(--s3); font-size: var(--fs-xs); font-weight: 650; color: var(--text-3); letter-spacing: .02em; }
.tip { display: grid; gap: var(--s1); padding: var(--s3) 0; border-top: 1px solid var(--border); }
.tip:first-child { border-top: 0; padding-top: 0; }
.tip-actions { display: flex; align-items: center; gap: var(--s3); font-size: var(--fs-xs); color: var(--text-3); }
.tip-actions button { border: 0; background: none; padding: 0; color: inherit; cursor: pointer; font-size: var(--fs-xs); }
.tip-actions button.on { color: var(--lose); }
.composer { display: flex; gap: var(--s2); }
.composer .input { flex: 1; }

/* 채팅 */
.chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: calc(100vh - 220px); min-height: 420px; padding: 0; overflow: hidden; }
@media (max-width: 959px) { .chat { height: calc(100dvh - 240px); min-height: 360px; } }
.chat-head { display: flex; align-items: center; gap: var(--s3); padding: var(--s4) var(--s5); border-bottom: 1px solid var(--border); }
.chat-head .online { margin-left: auto; display: flex; align-items: center; padding-left: 6px; }
.chat-head .online .initial { width: 26px; height: 26px; font-size: 11px; margin-left: -6px; box-shadow: 0 0 0 2px var(--surface); }
.chat-log { overflow-y: auto; padding: var(--s2) var(--s5) var(--s4); display: flex; flex-direction: column; }
.msg { display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: var(--s3); padding: 2px var(--s2); margin: 0 calc(-1 * var(--s2)); border-radius: var(--r-s); }
.msg:hover { background: var(--surface-2); }
.msg.first { margin-top: var(--s3); padding-top: var(--s1); }
.msg .initial { grid-row: span 2; }
.msg .who-line { display: flex; align-items: baseline; gap: var(--s2); }
.msg .who-line b { font-size: var(--fs-sm); }
.msg.mine .who-line b { color: var(--accent); }
.msg .text { grid-column: 2; white-space: pre-wrap; word-break: break-word; }
.msg .del { opacity: 0; border: 0; background: none; color: var(--text-3); cursor: pointer; font-size: var(--fs-xs); padding: 0; }
.msg:hover .del { opacity: 1; }
.day { align-self: center; margin: var(--s4) 0 0; font-size: var(--fs-xs); color: var(--text-3); }
.chat-input { display: flex; gap: var(--s2); padding: var(--s3) var(--s4); border-top: 1px solid var(--border); }
.chat-input .input { flex: 1; height: 40px; }
.chat-input .btn { height: 40px; }

/* 표 */
.table { display: grid; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 56px 120px 48px; align-items: center; gap: var(--s3); padding: 10px 0; border-top: 1px solid var(--border); }
.trow:first-child { border-top: 0; padding-top: 0; }
.trow .num { text-align: right; font-size: var(--fs-sm); }
@media (max-width: 600px) { .trow { grid-template-columns: minmax(0, 1fr) 44px 64px 44px; } }
.kv { display: grid; }
.kv > div { display: flex; justify-content: space-between; align-items: center; gap: var(--s4); padding: var(--s3) 0; border-top: 1px solid var(--border); min-height: 48px; }
.kv > div:first-child { border-top: 0; padding-top: 0; }
.kv .k { color: var(--text-2); }
.kv .v { text-align: right; }
.note { font-size: var(--fs-xs); color: var(--text-3); line-height: 1.6; }
.foot { text-align: center; padding-top: var(--s6); margin: 0; }
</style>
</head>

<script>
const CONSENT = 'Riot 계정을 연결하면 아수라장 전적이 Prism에 자동으로 수집됩니다. 회원에게만 보이며, 연결을 해제하면 수집이 중단됩니다.';
const VIEWS = [
  { id: 'home', label: '홈', icon: 'i-home' },
  { id: 'augments', label: '증강', icon: 'i-spark' },
  { id: 'dex', label: '도감', icon: 'i-grid' },
  { id: 'prism', label: '모임', icon: 'i-users' },
  { id: 'chat', label: '채팅', icon: 'i-chat' },
  { id: 'settings', label: '설정', icon: 'i-gear', desktopOnly: true },
];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (w, n) => (n ? Math.round((w / n) * 100) + '%' : '–');
const ago = (t) => { const m = Math.max(0, Math.round((Date.now() - t) / 60000)); return m < 1 ? '방금' : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.round(m / 60)}시간 전` : `${Math.round(m / 1440)}일 전`; };
const day = (t) => new Date(t).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
const time = (t) => new Date(t).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
const date = (t) => (t ? new Date(t).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' }) : '');

let S = null; // 앱 상태
let ST = { champions: {}, items: {}, augments: {} };
let view = 'home';

// ───── 공통 조각 ─────
const asset = (path, cls = 'av') => (path ? `<img class="${cls}" loading="lazy" alt="" src="/asset?path=${encodeURIComponent(path)}">` : `<span class="${cls}"></span>`);
const champName = (id) => ST.champions[id]?.name ?? `#${id}`;
const champAv = (id, cls = 'av') => asset(ST.champions[id]?.icon, cls);
const rarity = (r) => (/prism/i.test(r ?? '') ? 'r-prism' : /gold/i.test(r ?? '') ? 'r-gold' : /silver/i.test(r ?? '') ? 'r-silver' : '');
const chip = (id, extra = '') => { const a = ST.augments[id]; return `<span class="chip ${rarity(a?.rarity)} ${a?.icon ? '' : 'noicon'}">${a?.icon ? asset(a.icon, '') : ''}${esc(a?.name ?? '증강 #' + id)}${extra ? ` <em>${extra}</em>` : ''}</span>`; };
const record = (r) => (r && r.n ? `<span class="wl">${pct(r.w, r.n)}</span> <span class="meta">${r.w}승 ${r.n - r.w}패</span>` : '<span class="meta">기록 없음</span>');
const empty = (text, action = '', compact = false) => `<div class="empty ${compact ? 'compact' : ''}"><span class="gem float"><img src="/brand/prism-64.png" alt=""></span><div>${text}</div>${action}</div>`;
const card = (title, body, side = '') => `<section class="card"><div class="card-head"><h2 class="card-title">${title}</h2>${side}</div>${body}</section>`;
const TONES = ['#5b6b8c', '#6b5b8c', '#5b8c7f', '#8c6b5b', '#7f8c5b', '#5b7f8c', '#8c5b6b', '#6b7a99'];
const initial = (nick) => { const s = String(nick ?? '?'); let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return `<span class="initial" style="background:${TONES[h % TONES.length]}">${esc([...s][0] ?? '?')}</span>`; };

async function j(url, init) {
  const r = await fetch(url, init && { ...init, headers: { 'Content-Type': 'application/json' } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error ?? `오류 (${r.status})`);
  return d;
}

// ───── 테마 ─────
const applyTheme = (t) => (t ? document.documentElement.setAttribute('data-theme', t) : document.documentElement.removeAttribute('data-theme'));
try { applyTheme(localStorage.getItem('prism-theme')); } catch {}
$('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('prism-theme', next); } catch {}
};

// ───── 내비게이션 ─────
let unread = 0;
function renderNav() {
  const badge = (id) => (id === 'chat' && unread ? `<span class="count">${unread > 99 ? '99+' : unread}</span>` : '');
  $('nav').innerHTML = VIEWS.map((v) => `<a href="#${v.id}" class="${view === v.id ? 'on' : ''}"><svg><use href="#${v.icon}"/></svg>${v.label}${badge(v.id)}</a>`).join('');
  $('tabbar').innerHTML = VIEWS.filter((v) => !v.desktopOnly).map((v) => `<a href="#${v.id}" class="${view === v.id ? 'on' : ''}"><svg><use href="#${v.icon}"/></svg>${v.label}${badge(v.id)}</a>`).join('');
}

function route() {
  const [v, arg] = location.hash.slice(1).split('/');
  view = VIEWS.some((x) => x.id === v) ? v : 'home';
  if (view === 'chat') unread = 0;
  renderNav();
  lastKey = '';
  render();
  if (view === 'dex' && arg) openChampion(Number(arg)); else closeSheet(false);
}
addEventListener('hashchange', route);

// ───── 상단 상태 ─────
function renderChrome() {
  const map = { 'no-client': ['클라이언트 꺼짐', ''], 'in-game': ['게임 중', 'accent'], ready: ['연결됨', 'ok'], error: ['연결 오류', 'warn'] };
  const [label, tone] = map[S.status] ?? [S.status, ''];
  for (const id of ['status', 'status-m']) { const el = $(id); el.textContent = label; el.className = `pill ${tone}`; el.title = S.message; }
  const nick = S.prism.me?.nick;
  $('who').innerHTML = S.me
    ? `${initial(nick ?? S.me.gameName)}<div style="min-width:0"><div class="name">${esc(nick ?? S.me.gameName)}</div><div class="sub">${esc(S.me.gameName)}#${esc(S.me.tagLine)}</div></div>`
    : `<div class="sub">${esc(S.message)}</div>`;
}

// ───── 홈 ─────
function streak(games) {
  if (!games.length) return null;
  let n = 0; for (const g of games) { if (g.win !== games[0].win) break; n++; }
  return { n, win: games[0].win };
}

// 챔피언 일러스트: 스플래시 → 타일 → 정사각 썸네일 순서로 대신한다
const champSplash = (id) => {
  const chain = [`/lol-game-data/assets/v1/champion-splashes/${id}/${id}000.jpg`, `/lol-game-data/assets/v1/champion-tiles/${id}/${id}000.jpg`, ST.champions[id]?.icon].filter(Boolean)
    .map((p) => `/asset?path=${encodeURIComponent(p)}`);
  return `<img alt="" loading="lazy" src="${chain[0]}" data-next="${chain.slice(1).join('|')}" onerror="const n=this.dataset.next.split('|').filter(Boolean);if(n.length){this.src=n.shift();this.dataset.next=n.join('|')}else this.remove()">`;
};
const stat = (label, r, locked) => `<div class="cs-stat"><span class="k">${label}</span>
  ${r && r.n ? `<span class="v">${pct(r.w, r.n)}</span><span class="n">${r.n}판 · ${r.w}승 ${r.n - r.w}패</span>`
    : `<span class="v none">–</span><span class="n">${locked ? '로그인 필요' : '기록 없음'}</span>`}</div>`;

// 벤치 정렬 기준과 목록 모양 (이 브라우저에만 기억)
const pref = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let benchSort = pref('prism-bench-sort', 'mine'); // 'mine' 내가 잘하는 순 | 'crew' 모임 승률 순
let benchVariant = pref('prism-bench-variant', 'tiles'); // 'tiles' 안 A | 'table' 안 B
let sortMenu = false;
const SORTS = { mine: ['내가 잘하는 순', '내가 한 판수 → 내 승률'], crew: ['모임 승률 순', '모임 승률 → 내 승률'] };
function setSort(k) { benchSort = k; setPref('prism-bench-sort', k); sortMenu = false; render(); }
addEventListener('click', (e) => { if (sortMenu && !e.target.closest('.cs-bench-top')) { sortMenu = false; render(); } });
let csPreview = null; // 벤치에서 눌러 본 챔피언 (화면 안에서만 바뀐다. 롤 클라이언트에는 요청 없음)
function champSelectCard() {
  const cs = S.champSelect, P = S.personal, crew = cs.crew;
  const rate = (r) => (r && r.n ? r.w / r.n : -1);
  // 벤치는 모임 승률 → 내 승률 순
  const games = (r) => r?.n ?? 0;
  const byCrew = (a, b) => rate(crew?.champions?.[b]?.crew) - rate(crew?.champions?.[a]?.crew) || rate(P?.champions[b]) - rate(P?.champions[a]);
  const byMine = (a, b) => games(P?.champions[b]) - games(P?.champions[a]) || rate(P?.champions[b]) - rate(P?.champions[a]) || byCrew(a, b);
  const bench = cs.bench.slice().sort(benchSort === 'crew' ? byCrew : byMine);
  if (csPreview && !bench.includes(csPreview)) csPreview = null;
  const ids = [cs.mine, ...bench].filter(Boolean);
  const mates = crew?.teammates ?? [];
  // 모임 기록 3판 이상 중 승률이 가장 높은 챔피언 하나
  let best = null;
  if (ids.length > 1) for (const id of ids) { const r = crew?.champions?.[id]?.crew; if (r && r.n >= 3 && (!best || r.w / r.n > best.rate)) best = { id, rate: r.w / r.n }; }
  const augsOf = (id) => {
    const crewAugs = (crew?.champions?.[id]?.topAugments ?? []).slice().sort((a, b) => b.w / b.n - a.w / a.n || b.n - a.n).slice(0, 2);
    const myAugs = (P?.augmentsByChampion[id] ?? []).slice(0, 2);
    return crewAugs.length ? { head: '모임 추천 증강', list: crewAugs } : myAugs.length ? { head: '내가 고른 증강', list: myAugs } : null;
  };

  const featured = (id) => {
    const c = crew?.champions?.[id];
    const isMine = id === cs.mine;
    const augs = augsOf(id);
    const master = c?.masters?.[0];
    return `<article class="cs-tile ${isMine ? 'mine' : ''}">
      <div class="cs-bg">${champSplash(id)}</div>
      ${best?.id === id ? '<span class="cs-best"><img src="/brand/prism-32.png" alt="">모임 최고 승률</span>' : ''}
      ${!isMine && cs.mine ? '<button type="button" class="cs-back" onclick="csPreview=null;render()">내 챔피언 보기</button>' : ''}
      <div class="cs-name"><b>${esc(champName(id))}</b><span>${isMine ? '내 챔피언' : '벤치 미리보기'}</span></div>
      <div class="cs-body">
        <div class="cs-stats">${stat('나', P?.champions[id])}${stat('모임', c?.crew, !S.prism.loggedIn)}</div>
        ${augs ? `<div class="cs-augs"><span class="head">${augs.head}</span>${augs.list.map((a) => `<div class="row">${chip(a.id)}<span class="meta">${pct(a.w, a.n)} · ${a.n}회</span></div>`).join('')}</div>` : ''}
        ${master ? `<div class="cs-master">${initial(master.nick)}<span>장인 <b style="color:var(--text)">${esc(master.nick)}</b> · ${master.n}판 ${pct(master.w, master.n)}</span></div>` : ''}
      </div></article>`;
  };
  const pick = (id) => `csPreview=${csPreview === id ? 'null' : id};render()`;
  const gemMark = (id, cls) => (best?.id === id ? `<img class="${cls}" src="/brand/prism-32.png" alt="모임 최고 승률" title="모임 최고 승률">` : '');
  // 안 A: 일러스트 타일
  const tileOf = (id) => {
    // 지금 정렬 기준의 숫자 하나만 보인다
    const r = benchSort === 'crew' ? crew?.champions?.[id]?.crew : P?.champions[id];
    const label = benchSort === 'crew' ? '모임' : '나';
    return `<button type="button" class="cb-tile ${csPreview === id ? 'on' : ''}" onclick="${pick(id)}" title="${esc(champName(id))} · 누르면 왼쪽에 미리보기">
      ${champSplash(id).replace('<img ', '<img class="art" ')}${gemMark(id, 'gem-mark')}
      <span class="nm">${esc(champName(id))}</span>
      <span class="rt">${r?.n ? `${label} ${pct(r.w, r.n)} · ${r.n}판` : `${label} 기록 없음`}</span></button>`;
  };
  // 안 B: 촘촘한 표
  const meter = (r) => (r && r.n ? `<span class="cb-meter"><span class="bar"><span style="width:${pct(r.w, r.n)}"></span></span><b>${pct(r.w, r.n)}</b></span>` : '<span class="cb-meter"><span></span><b class="none">–</b></span>');
  const rowOf = (id) => `<button type="button" class="cb-row ${csPreview === id ? 'on' : ''}" onclick="${pick(id)}">${champAv(id)}
      <span class="nm">${gemMark(id, '')}<span>${esc(champName(id))}</span>${P?.champions[id]?.n ? `<small class="meta">${P.champions[id].n}판</small>` : ''}</span>
      ${meter(P?.champions[id])}${meter(crew?.champions?.[id]?.crew)}</button>`;
  const benchList = benchVariant === 'table'
    ? `<div class="cs-bench-list cb-table"><div class="cb-head"><span>챔피언</span><span>나</span><span>모임</span></div>${bench.map(rowOf).join('')}</div>`
    : `<div class="cs-bench-list cb-tiles">${bench.map(tileOf).join('')}</div>`;
  const sortUi = `<button type="button" class="cs-sort" aria-haspopup="true" aria-expanded="${sortMenu}" onclick="sortMenu=!sortMenu;render()" title="벤치 정렬"><svg><use href="#i-sort"/></svg>${SORTS[benchSort][0]}</button>
    ${sortMenu ? `<div class="cs-sort-menu" role="menu">${Object.entries(SORTS).map(([k, [label, hint]]) => `<button type="button" role="menuitemradio" aria-checked="${benchSort === k}" onclick="setSort('${k}')">${benchSort === k ? '<svg><use href="#i-check"/></svg>' : '<span></span>'}<span><b>${label}</b><small>${hint}</small></span></button>`).join('')}</div>` : ''}`;

  const shown = csPreview ?? cs.mine ?? bench[0];
  const body = `<div class="cs">
    ${mates.length ? `<div class="cs-mates"><span class="label">같은 팀 Prism</span>${mates.map((m) => `<span class="mate">${initial(m.nick)}<b>${esc(m.nick)}</b>같이 ${pct(m.together.w, m.together.n)}</span>`).join('')}</div>` : ''}
    ${shown ? `<div class="cs-layout">${featured(shown)}
      <div class="cs-bench-wrap"><div class="cs-bench">
        <div class="cs-bench-top"><span class="cs-bench-title">${bench.length ? `벤치<b>${bench.length}</b>` : '벤치가 비어 있습니다'}</span>${bench.length > 1 ? sortUi : ''}</div>
        ${bench.length ? benchList : ''}
      </div></div></div>` : empty('챔피언이 정해지면 여기에 나타납니다.', '', true)}
    ${!S.prism.loggedIn ? '<p class="note" style="margin:0">Prism에 로그인하면 모임 승률·추천 증강·장인과 같은 팀 회원 케미가 함께 보입니다.</p>' : ''}
  </div>`;
  return card('챔프 선택', body, '<span class="pill accent live">진행 중</span>');
}

function renderHome() {
  const P = S.personal, games = S.games;
  const head = `<div class="page-head"><div><h1>${S.prism.me ? `${esc(S.prism.me.nick)}님, 오늘 밤도 한 판` : '아수라장 기록'}</h1><p>${S.status === 'ready' ? '최근 100판 중 아수라장 판을 모았습니다.' : esc(S.message)}</p></div></div>`;
  if (!games.length) {
    return head + (S.champSelect ? champSelectCard() : '') + `<section class="card">${empty(S.status === 'ready' ? '최근 100판 중 아수라장 판이 없습니다.<br>한 판 하고 나면 여기에 나타납니다.' : esc(S.message))}</section>`;
  }
  const st = streak(games);
  const dexTotal = Object.keys(ST.champions).length;
  const dexN = Object.keys(P.champions).length;
  const stats = `<div class="grid g4">
    <section class="card stat"><span class="label">아수라장</span><span class="value">${P.total.n}<small>판</small></span></section>
    <section class="card stat"><span class="label">승률</span><span class="value">${pct(P.total.w, P.total.n)}</span></section>
    <section class="card stat"><span class="label">지금</span><span class="value ${st.win ? 'w' : 'l'}">${st.n}<small>${st.win ? '연승' : '연패'}</small></span></section>
    <section class="card stat"><span class="label">도감</span><span class="value">${dexN}<small>/ ${dexTotal || '–'}</small></span></section></div>`;
  const recent = games.slice(0, 10);
  const rw = recent.filter((g) => g.win).length;
  const avg = (f) => (recent.reduce((t, g) => t + f(g), 0) / recent.length).toFixed(1);
  const r10 = `<div class="r10">
    <div class="r10-sum"><span class="label">승률</span><span class="big">${pct(rw, recent.length)}</span><span class="wl-line">${rw}승 ${recent.length - rw}패</span>
      <span class="meta">평균 KDA ${avg((g) => g.kills)} / ${avg((g) => g.deaths)} / ${avg((g) => g.assists)}</span></div>
    <div class="r10-row">${Array.from({ length: 10 }, (_, i) => { const g = recent[i];
      return g ? `<a class="r10-g ${g.win ? 'is-w' : 'is-l'}" href="#dex/${g.championId}" title="${esc(champName(g.championId))} · ${g.win ? '승리' : '패배'} · ${g.kills}/${g.deaths}/${g.assists} · ${ago(g.playedAt)}">${champSplash(g.championId)}<span class="res">${g.win ? '승' : '패'}</span><span class="kda">${g.kills}/${g.deaths}/${g.assists}</span></a>`
        : '<div class="r10-g none"></div>'; }).join('')}</div></div>`;
  const gameRows = games.slice(0, 15).map((g) => `<div class="game ${g.win ? 'is-w' : 'is-l'}"><span class="edge"></span>${champAv(g.championId)}
    <div style="min-width:0"><div class="line"><b>${esc(champName(g.championId))}</b><span>${g.kills} / ${g.deaths} / ${g.assists}</span>
      ${g.damageToChampions !== null ? `<span class="meta">딜 ${g.damageToChampions.toLocaleString()}</span>` : ''}</div>
      ${g.augments.length ? `<div class="chips">${g.augments.map((id) => chip(id)).join('')}</div>` : ''}</div>
    <div class="end"><span class="meta">${g.win ? '<b class="w">승리</b>' : '<b class="l">패배</b>'} · ${Math.round(g.duration / 60)}분 · ${ago(g.playedAt)}</span>
      <div class="items">${g.items.map((id) => asset(ST.items[id]?.icon, '')).join('')}</div></div></div>`).join('');
  const topAugs = P.augments.slice(0, 6);
  const topChamps = Object.entries(P.champions).sort((a, b) => b[1].n - a[1].n).slice(0, 5);
  return head + (S.champSelect ? champSelectCard() : '') + stats
    + card('최근 10판', r10, '<span class="meta">왼쪽이 최근 · 누르면 도감</span>')
    + `<div class="grid g-main">`
    + card('최근 판', `<div>${gameRows}</div>`)
    + `<div class="grid" style="align-content:start">`
    + card('자주 고른 증강', topAugs.length ? `<div class="list">${topAugs.map((a) => `<div class="item" style="grid-template-columns:minmax(0,1fr) auto"><div>${chip(a.id)}</div><span class="end">${record(a)}</span></div>`).join('')}</div>` : empty('증강 정보가 아직 없습니다.', '', true), '<a class="meta" href="#augments">전체 보기</a>')
    + card('자주 한 챔피언', `<div class="list">${topChamps.map(([id, r]) => `<a class="item" href="#dex/${id}">${champAv(id, 'av s')}<span class="title">${esc(champName(id))}</span><span class="end">${record(r)}</span></a>`).join('')}</div>`, '<a class="meta" href="#dex">도감</a>')
    + `</div></div>`;
}

// ───── 증강 ─────
let augChamp = '';
function renderAugments() {
  const P = S.personal;
  const champs = Object.entries(P?.champions ?? {}).filter(([id]) => P.augmentsByChampion[id]?.length).sort((a, b) => b[1].n - a[1].n);
  const list = augChamp ? P?.augmentsByChampion[augChamp] ?? [] : P?.augments ?? [];
  const select = `<select class="input" id="aug-champ" style="height:32px"><option value="">전체 챔피언</option>${champs.map(([id, r]) => `<option value="${id}" ${augChamp === id ? 'selected' : ''}>${esc(champName(id))} · ${r.n}판</option>`).join('')}</select>`;
  const body = list.length
    ? `<div class="table">${list.map((a) => `<div class="trow"><div>${chip(a.id)}</div><span class="num meta">${a.n}회</span><div class="bar"><span style="width:${pct(a.w, a.n)}"></span></div><span class="num wl">${pct(a.w, a.n)}</span></div>`).join('')}</div>
       <p class="note" style="margin:var(--s4) 0 0">증강 정보가 있는 ${P.augmentGames}판 기준 · 승률은 그 증강을 고른 판의 승률입니다.</p>`
    : empty(S.games.length ? '증강 정보가 오지 않습니다.<br>설정의 진단 파일을 보내주시면 고치겠습니다.' : '아직 기록이 없습니다.');
  return `<div class="page-head"><div><h1>내 증강 기록</h1><p>어떤 증강을 자주 고르고, 골랐을 때 얼마나 이겼는지</p></div></div>` + card(augChamp ? esc(champName(augChamp)) : '전체', body, select);
}

// ───── 도감 ─────
let dexFilter = 'all', dexQuery = '';
function renderDex() {
  const P = S.personal;
  const all = Object.entries(ST.champions).sort((a, b) => a[1].name.localeCompare(b[1].name, 'ko'));
  const played = all.filter(([id]) => P?.champions[id]).length;
  const list = all.filter(([id, c]) => (dexFilter === 'all' || (dexFilter === 'played') === Boolean(P?.champions[id])) && (!dexQuery || c.name.includes(dexQuery)));
  const progress = `<div class="progress"><b style="font-size:var(--fs-xl)">${played}<span class="meta"> / ${all.length}</span></b><div class="bar"><span style="width:${all.length ? (played / all.length) * 100 : 0}%"></span></div></div>`;
  const toolbar = `<div class="toolbar" style="margin:var(--s5) 0 var(--s4)"><input class="input" id="dex-q" placeholder="챔피언 검색" value="${esc(dexQuery)}">
    <div class="seg">${[['all', '전체'], ['played', '해본'], ['new', '안 해본']].map(([k, l]) => `<button type="button" data-f="${k}" class="${dexFilter === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>`;
  const grid = all.length
    ? (list.length ? `<div class="dex">${list.map(([id, c]) => { const r = P?.champions[id];

const CH = { connected: false, me: null, online: [], messages: [], error: null };
let chatFollow = true;
function renderChat() {
  const g = gate('채팅');
  if (g) return g;
  const online = CH.online.slice(0, 5).map((o) => initial(o.nick)).join('');
  return `<div class="page-head"><div><h1>채팅</h1><p>Prism 회원끼리 · 오늘 밤 누구 켜요?</p></div></div>
    <section class="card chat">
      <div class="chat-head"><b># prism</b><span class="pill ${CH.connected ? 'ok' : 'warn'}">${CH.connected ? `접속 ${CH.online.length}명` : '연결 중…'}</span>
        <span class="online" title="${esc(CH.online.map((o) => o.nick).join(', '))}">${online}</span></div>
      <div class="chat-log" id="chat-log">${chatLog()}</div>
      <form class="chat-input" id="chat-form"><input class="input" id="chat-text" maxlength="300" autocomplete="off" placeholder="${CH.connected ? '메시지 보내기' : '연결되면 보낼 수 있습니다'}">
        <button class="btn primary" type="submit"><svg width="16" height="16"><use href="#i-send"/></svg>보내기</button></form>
    </section>`;
}
function chatLog() {
  if (!CH.messages.length) return empty(CH.connected ? '첫 메시지를 남겨보세요.' : esc(CH.error ?? '채팅 서버에 연결하는 중입니다.'), '', true);
  let out = '', prev = null;
  for (const m of CH.messages) {
    const newDay = !prev || new Date(prev.at).toDateString() !== new Date(m.at).toDateString();
    if (newDay) out += `<div class="day">${day(m.at)}</div>`;
    const first = newDay || prev.memberId !== m.memberId || m.at - prev.at > 5 * 60000;
    const mine = m.memberId === CH.me;
    const del = mine ? ` <button class="del" type="button" onclick="delChat(${m.id})">지우기</button>` : '';
    out += `<div class="msg ${first ? 'first' : ''} ${mine ? 'mine' : ''}">${first ? initial(m.nick) : '<span></span>'}
      ${first ? `<div class="who-line"><b>${esc(m.nick)}</b><span class="meta">${time(m.at)}</span>${del}</div>` : ''}
      <div class="text">${esc(m.text)}${first ? '' : del}</div></div>`;
    prev = m;
  }
  return out;
}
function paintChat() {
  const log = $('chat-log');
  if (!log) { lastKey = ''; render(); return; }
  chatFollow = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.innerHTML = chatLog();
  scrollChat();
}
function scrollChat(force) { const log = $('chat-log'); if (log && (force || chatFollow)) log.scrollTop = log.scrollHeight; }
async function delChat(id) { await j('/api/chat/delete', { method: 'POST', body: JSON.stringify({ id }) }).catch(() => {}); }
function bindChat() {
  const f = $('chat-form');
  if (!f) return;
  f.onsubmit = async (e) => {
    e.preventDefault();
    const input = $('chat-text'), text = input.value.trim();
    if (!text) return;
    try { await j('/api/chat/send', { method: 'POST', body: JSON.stringify({ text }) }); input.value = ''; chatFollow = true; }
    catch (err) { input.placeholder = err.message; }
  };
}
let es = null;
function startStream() {
  if (es) return;
  es = new EventSource('/api/chat/stream');
  es.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type === 'snapshot') Object.assign(CH, { connected: d.connected, me: d.me, online: d.online, messages: d.messages, error: d.error });
    else if (d.type === 'message') { CH.messages = [...CH.messages, d.message].slice(-200); if (view !== 'chat' && d.message.memberId !== CH.me) { unread++; renderNav(); } }
    else if (d.type === 'deleted') CH.messages = CH.messages.filter((m) => m.id !== d.id);
    else if (d.type === 'presence') CH.online = d.online;
    else if (d.type === 'status') { CH.connected = d.connected; if (d.error) CH.error = d.error; }
    else if (d.type === 'error') { const i = $('chat-text'); if (i) i.placeholder = d.message; }
    if (view !== 'chat') return;
    if (d.type === 'message' || d.type === 'deleted') paintChat();
    else { lastKey = ''; render(); }
  };
}

  if (view === 'augments') $('aug-champ').onchange = (e) => { augChamp = e.target.value; e.target.blur(); render(); };
  if (view === 'dex') {
    document.querySelectorAll('.seg [data-f]').forEach((b) => (b.onclick = () => { dexFilter = b.dataset.f; render(); }));
    const q = $('dex-q');
    q.oninput = () => { clearTimeout(q._t); q._t = setTimeout(() => { dexQuery = q.value.trim(); const pos = q.selectionStart; q.blur(); render(); const n = $('dex-q'); n.focus(); n.setSelectionRange(pos, pos); }, 200); };
  }
  if (view === 'chat') { bindChat(); scrollChat(true); }
  if (view === 'settings') bindSettings();
}

async function poll(once) {
  try {
    S = await j('/api/state');
    if (!Object.keys(ST.champions).length) { ST = await j('/api/static'); if (Object.keys(ST.champions).length) lastKey = ''; }
    if (S.prism.loggedIn) startStream();
    render();
  } catch { for (const id of ['status', 'status-m']) { $(id).textContent = '앱 꺼짐'; $(id).className = 'pill warn'; } }
  if (once !== true) setTimeout(poll, 5000);
}
renderNav();
poll().then(route);
</script>
