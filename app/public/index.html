<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prism 앱</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --line: #e4e2db; --text: #1b1d24; --muted: #6b6e78;
    --win: #2f6fdf; --lose: #d2463c; --ok: #2b8a3e; --warn: #b7791f;
    --spectrum-1: #e5484d; --spectrum-2: #f76b15; --spectrum-3: #ffc53d; --spectrum-4: #46a758;
    --spectrum-5: #0090ff; --spectrum-6: #3e63dd; --spectrum-7: #8e4ec6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1220; --surface: #161b2e; --line: #262c44; --text: #e8eaf2; --muted: #9096ab;
      --win: #5b8def; --lose: #ef6b62; --ok: #4cc26a; --warn: #e0a84a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1220; --surface: #161b2e; --line: #262c44; --text: #e8eaf2; --muted: #9096ab;
    --win: #5b8def; --lose: #ef6b62; --ok: #4cc26a; --warn: #e0a84a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Pretendard Variable", Pretendard, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .logo { font-weight: 800; font-size: 18px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .logo i { width: 18px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--spectrum-1), var(--spectrum-2), var(--spectrum-3), var(--spectrum-4), var(--spectrum-5), var(--spectrum-6), var(--spectrum-7)); }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { color: var(--ok); border-color: currentColor; }
  .badge.warn { color: var(--warn); border-color: currentColor; }
  .spacer { flex: 1; }
  button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .grid2 { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .muted { color: var(--muted); }
  .strip { display: flex; gap: 4px; }
  .strip span { flex: 1; height: 8px; border-radius: 2px; background: var(--line); }
  .strip .w { background: var(--win); } .strip .l { background: var(--lose); }
  .champ { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .champ img, .noimg { width: 36px; height: 36px; border-radius: 8px; background: var(--line); flex: none; }
  .champ .rec { margin-left: auto; text-align: right; }
  .game { display: grid; grid-template-columns: 4px 40px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .game:first-child { border-top: 0; }
  .game .bar { border-radius: 2px; } .game.win .bar { background: var(--win); } .game.lose .bar { background: var(--lose); }
  .game img.c { width: 40px; height: 40px; border-radius: 8px; }
  .line { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .items { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
  .items img { width: 22px; height: 22px; border-radius: 4px; background: var(--line); }
  .aug { font-size: 12px; color: var(--muted); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 4px 0; border-top: 1px solid var(--line); } tr:first-child td { border-top: 0; }
  td:last-child { text-align: right; }
  .yes { color: var(--ok); } .no { color: var(--lose); }
  footer { font-size: 12px; color: var(--muted); text-align: center; padding: 8px 0 24px; }
  .empty { color: var(--muted); padding: 12px 0; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo"><i></i>Prism</div>
    <span id="status" class="badge">확인 중</span>
    <span id="me" class="muted"></span>
    <span class="spacer"></span>
    <button id="theme" type="button">테마</button>
  </header>

  <section id="champselect" class="card" hidden>
    <h2>챔프 선택 · 내 아수라장 기록 기준</h2>
    <div id="cs-body"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>최근 10판</h2>
      <div id="strip" class="strip"></div>
      <p id="summary" class="muted" style="margin:8px 0 0"></p>
    </section>
    <section class="card">
      <h2>데이터 확인 (개발 검증용)</h2>
      <table id="fields"></table>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
        <button id="export" type="button">진단 파일 저장</button>
        <span id="export-msg" class="muted" style="font-size:12px"></span>
      </div>
    </section>
  </div>

  <section class="card">
    <h2>최근 아수라장 판</h2>
    <div id="games"></div>
  </section>

  <footer>LCU 읽기 전용 · 게임 중에는 요청 없음 · 서버로 보내는 데이터 없음 · <span id="ver"></span></footer>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (path, cls = '') => (path ? `<img class="${cls}" loading="lazy" alt="" src="/asset?path=${encodeURIComponent(path)}">` : `<span class="noimg"></span>`);
  const pct = (w, n) => (n ? Math.round((w / n) * 100) + '%' : '-');
  const ago = (t) => {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 60) return `${m}분 전`;
    if (m < 1440) return `${Math.round(m / 60)}시간 전`;
    return `${Math.round(m / 1440)}일 전`;
  };

  // 테마: 시스템 설정 기본, 토글은 이 브라우저에만 기억
  const applyTheme = (t) => (t ? document.documentElement.setAttribute('data-theme', t) : document.documentElement.removeAttribute('data-theme'));
  try { applyTheme(localStorage.getItem('prism-theme')); } catch {}
  $('theme').onclick = () => {
    const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#0e1220';
    const next = dark ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('prism-theme', next); } catch {}
  };

  $('export').onclick = async () => {
    $('export-msg').textContent = '저장 중…';
    try {
      const r = await fetch('/api/export', { method: 'POST' }).then((r) => r.json());
      $('export-msg').textContent = r.error ? r.error : `저장됨: ${r.file}`;
    } catch (e) {
      $('export-msg').textContent = '저장 실패: ' + e;
    }
  };

  function champRow(s, rec, label) {
    const name = s.names.champions[rec.championId] ?? `#${rec.championId}`;
    return `<div class="champ">${icon(s.icons.champions[rec.championId])}<div><b>${esc(name)}</b>${label ? ` <span class="muted">${label}</span>` : ''}</div>
      <div class="rec">${rec.n ? `${rec.w}승 ${rec.n - rec.w}패 · <b>${pct(rec.w, rec.n)}</b>` : '<span class="muted">기록 없음</span>'}</div></div>`;
  }

  function render(s) {
    const st = $('status');
    st.textContent = { 'no-client': '클라이언트 꺼짐', 'in-game': '게임 중', ready: '연결됨', error: '오류' }[s.status] ?? s.status;
    st.className = 'badge ' + (s.status === 'ready' ? 'ok' : s.status === 'error' ? 'warn' : '');
    st.title = s.message;
    $('me').textContent = s.me ? `${s.me.gameName}#${s.me.tagLine}` : s.message;
    $('ver').textContent = 'v' + s.version;

    // 챔프 선택
    const cs = s.champSelect;
    $('champselect').hidden = !cs;
    if (cs) {
      const bench = [...cs.bench].sort((a, b) => b.w / (b.n || 1) - a.w / (a.n || 1) || b.n - a.n);
      $('cs-body').innerHTML =
        (cs.mine ? champRow(s, cs.mine, '내 챔피언') : '<p class="empty">아직 챔피언이 정해지지 않았습니다.</p>') +
        (bench.length ? `<h2 style="margin-top:12px">교체 가능 (벤치)</h2>` + bench.map((r) => champRow(s, r)).join('') : '') +
        (cs.team.length ? `<h2 style="margin-top:12px">우리 팀</h2>` + cs.team.map((r) => champRow(s, r)).join('') : '');
    }

    // 최근 10판 띠
    const recent = s.games.slice(0, 10);
    $('strip').innerHTML = Array.from({ length: 10 }, (_, i) => `<span class="${recent[i] ? (recent[i].win ? 'w' : 'l') : ''}"></span>`).join('');
    const w = s.games.filter((g) => g.win).length;
    $('summary').textContent = s.games.length ? `아수라장 ${s.games.length}판 · ${w}승 ${s.games.length - w}패 (${pct(w, s.games.length)})` : '';

    // 데이터 확인
    const n = s.games.length;
    const rows = [
      ['읽은 전체 판', s.scannedGames],
      ['그중 아수라장(2400)', n],
      ...Object.entries(s.fields).map(([k, v]) => [k, n ? `<span class="${v ? 'yes' : 'no'}">${v}/${n}</span>` : '-']),
      ['큐 분포', esc(Object.entries(s.queueCounts).map(([q, c]) => `${q}:${c}`).join(' ') || '-')],
    ];
    $('fields').innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');

    // 판 목록
    $('games').innerHTML = s.games.length
      ? s.games.slice(0, 30).map((g) => {
          const champ = s.names.champions[g.championId] ?? `#${g.championId}`;
          const augs = g.augments.map((id) => s.names.augments[id] ?? `#${id}`).join(' · ');
          const dmg = g.damageToChampions !== null ? ` · 딜 ${g.damageToChampions.toLocaleString()}` : '';
          return `<div class="game ${g.win ? 'win' : 'lose'}"><div class="bar"></div>${icon(s.icons.champions[g.championId], 'c')}
            <div><div class="line"><b>${esc(champ)}</b><span>${g.kills}/${g.deaths}/${g.assists}</span>
              <span class="muted">${g.win ? '승' : '패'} · ${Math.round(g.duration / 60)}분${dmg} · ${ago(g.playedAt)}</span></div>
              <div class="items">${g.items.map((id) => icon(s.icons.items[id])).join('')}</div>
              <div class="aug">${augs ? '증강 ' + esc(augs) : '증강 정보 없음'}</div></div></div>`;
        }).join('')
      : `<p class="empty">${s.status === 'ready' ? '최근 100판 중 아수라장 판이 없습니다.' : esc(s.message)}</p>`;
  }

  async function poll() {
    try { render(await fetch('/api/state').then((r) => r.json())); }
    catch { $('status').textContent = '앱 꺼짐'; }
    setTimeout(poll, 5000);
  }
  poll();
</script>
</body>
</html>
