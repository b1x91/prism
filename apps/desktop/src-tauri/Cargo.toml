[package]
name = "prism-desktop"
version = "0.9.78"
description = "Prism — 아수라장 동반 앱"
edition = "2021"
publish = false

[lib]
name = "prism_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
base64 = "0.22"
url = "2"
sha2 = "0.10"

[dev-dependencies]
# QA 끝단 시험이 가상 게임 화면(PNG)을 읽는다 (vision.rs qa_e2e)
png = "0.17"

[target.'cfg(windows)'.dependencies]
# 게임 중 증강 인식: 화면 일부 캡처(GDI) + Windows 내장 문자 인식(Windows.Media.Ocr), 게임 위 작은 창
windows = { version = "0.61", features = [
  "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_WinRT",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
