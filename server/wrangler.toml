# Prism 서버 — Cloudflare Workers + D1
name = "prism"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[triggers]
crons = ["17 18 * * *", "0 12 * * *"] # 매일 03:17 KST — 만료 코드 정리·역할 자동 승급 / 매일 21:00 KST — 봇의 밤 공지

[[d1_databases]]
binding = "DB"
database_name = "prism"
database_id = "00000000-0000-0000-0000-000000000000" # 배포 전: npx wrangler d1 create prism 의 결과로 교체
migrations_dir = "migrations"

[vars]
PUBLIC_URL = "" # 비워 두면 요청이 들어온 주소를 쓴다. 나중에 도메인(api.przm.gg 등)을 붙이면 그 주소
DISCORD_CLIENT_ID = "1549034168384491671"
DISCORD_GUILD_ID = "793740647207010304"
ADMIN_DISCORD_IDS = "426955675592163329"
# 모임 소통 창구. 앱 사이드바·모임 화면의 바로가기 버튼으로 나간다 (비어 있으면 버튼을 숨긴다)
DISCORD_INVITE_URL = "https://discord.gg/rK3U7xB6WQ"
# 음성 채널별 초대 링크 (누구나 그 채널로 바로 들어옴). 비어 있으면 서버 초대 링크를 복사한다
# 형식: 채널ID=초대주소, ... (ᴠᴏɪᴄᴇ #1 793740647575846942 / #2 793740647575846941 / #3 1405112550999195678)
VOICE_INVITES = "793740647575846942=https://discord.gg/zMWHDf7hUM,793740647575846941=https://discord.gg/GMTHwpXY6M,1405112550999195678=https://discord.gg/DdpDQbwEsH"
KAKAO_OPENCHAT_URL = "https://open.kakao.com/o/gveIYCSi" # 모임 카카오톡 오픈채팅 (2026-10-16 개설, 방 이름 PRSM)
# 웹 사이트 주소 (로그인 후 돌아갈 곳, CORS 허용). 쉼표 구분
WEB_ORIGINS = "https://przm.web.app,https://przm.gg"
# 앱 설치 파일을 올리는 저장소. 비공개면 비밀값 RELEASE_TOKEN(읽기 전용 GitHub 토큰)이 있어야 /app/* 가 동작한다
RELEASE_REPO = "b1x91/prism"
# 디스코드 봇 (v3.53). 토큰은 비밀값 DISCORD_BOT_TOKEN (GitHub Secrets). 공개 키·채널 ID 는 공개돼도 되는 값
DISCORD_PUBLIC_KEY = "33098ec7b5dcbfa5ba3028dede02253be517df8f79d1cada9064864bc5364611"
BOT_CHANNEL_ID = "1404769758771019847" # 일반 채팅방
WELCOME_CHANNEL_ID = "" # 멤버 환영 채널 (비우면 위 채널)
# 디스코드 역할별 기능은 server/src/roles.ts (역할 ID·이름·색, 기능별 최소 단계)
# 비밀값은 wrangler secret put DISCORD_CLIENT_SECRET 로 넣는다 (파일에 쓰지 않는다)
