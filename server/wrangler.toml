# Prism 서버 — Cloudflare Workers + D1
name = "prism"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[triggers]
crons = ["17 18 * * *"] # 매일 03:17 KST — 만료 코드 정리

[[d1_databases]]
binding = "DB"
database_name = "prism"
database_id = "00000000-0000-0000-0000-000000000000" # 배포 전: npx wrangler d1 create prism 의 결과로 교체
migrations_dir = "migrations"

# 실시간 채팅방 (Durable Object, SQLite 저장소)
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[vars]
PUBLIC_URL = "https://prism.example.workers.dev" # 배포 전: 실제 Worker 주소로 교체
DISCORD_CLIENT_ID = ""
DISCORD_GUILD_ID = ""
ADMIN_DISCORD_IDS = ""
# 비밀값은 wrangler secret put DISCORD_CLIENT_SECRET 로 넣는다 (파일에 쓰지 않는다)
