<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>허브 탭 디자인</title>
<style>
:root {
  --bg: #f5f5f2; --surface: #fff; --surface-2: #f3f3ef; --surface-3: #e7e7e1;
  --line: rgba(18,22,38,.08); --line-2: rgba(18,22,38,.15);
  --text: #11141f; --text-2: #4d5469; --text-3: #8a8fa2;
  --accent: #3a63f0; --accent-soft: rgba(58,99,240,.10); --on-accent: #fff;
  --lose: #e0484d; --ok: #18925c; --gold: #c3951d;
  --shadow: 0 1px 2px rgba(16,20,36,.05), 0 12px 32px rgba(16,20,36,.07);
  --thumb: #fff; --track: rgba(18,22,38,.05);
  --ease: cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07090f; --surface: #0f1322; --surface-2: #151a2c; --surface-3: #1d2339;
  --line: rgba(170,182,230,.08); --line-2: rgba(170,182,230,.16);
  --text: #eef1f8; --text-2: #a7aec4; --text-3: #69708c;
  --accent: #7c9cff; --accent-soft: rgba(124,156,255,.14); --on-accent: #07090f;
  --lose: #ff6a6f; --ok: #3fd08f; --gold: #f2c14c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.35);
  --thumb: #1d2339; --track: rgba(255,255,255,.04);
} }
:root[data-theme="dark"] {
  --bg: #07090f; --surface: #0f1322; --surface-2: #151a2c; --surface-3: #1d2339;
  --line: rgba(170,182,230,.08); --line-2: rgba(170,182,230,.16);
  --text: #eef1f8; --text-2: #a7aec4; --text-3: #69708c;
  --accent: #7c9cff; --accent-soft: rgba(124,156,255,.14); --on-accent: #07090f;
  --lose: #ff6a6f; --ok: #3fd08f; --gold: #f2c14c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.35);
  --thumb: #1d2339; --track: rgba(255,255,255,.04);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; word-break: keep-all; }
button { font: inherit; color: inherit; }
svg { display: block; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -.01em; }
.lead { margin: 0 0 24px; color: var(--text-2); max-width: 760px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
.bar .sp { flex: 1; }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 0 12px; height: 32px; border-radius: 8px; font-weight: 650; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.note { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; margin-bottom: 16px; padding: 16px 20px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.note h2 { margin: 0 0 4px; font-size: 16px; }
.note p { margin: 0; color: var(--text-2); font-size: 13px; }
.rec { font-size: 12px; font-weight: 750; color: var(--on-accent); background: var(--accent); padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }

/* 앱 틀 */
.frame { border-radius: 16px; overflow: hidden; border: 1px solid var(--line-2); background: var(--bg); box-shadow: var(--shadow); }
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 680px; }
.side { display: flex; flex-direction: column; gap: 20px; padding: 20px 12px; border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 800; letter-spacing: .1em; font-size: 16px; }
.glabel { padding: 0 12px; margin-bottom: 4px; font-size: 12px; font-weight: 750; letter-spacing: .06em; color: var(--text-3); }
.group { display: grid; gap: 2px; }
.nav { display: grid; gap: 20px; }
.item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 38px; padding: 0 12px; border: 0; border-radius: 12px; background: none; color: var(--text-2); font-weight: 650; text-align: left; cursor: pointer; transition: background-color .15s, color .15s; }
.item svg { width: 20px; height: 20px; flex: none; }
.item:hover { background: var(--surface-2); color: var(--text); }
.item.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.item.on svg { color: var(--accent); }
.item .chev { width: 16px; height: 16px; margin-left: auto; color: var(--text-3); transition: transform .3s var(--ease); }
.item.open .chev { transform: rotate(90deg); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lose); flex: none; }
.item .dot { margin-left: auto; }
.main { min-width: 0; overflow: auto; padding: 32px; }

/* 자리표시 내용 */
.ghost { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.gcard { min-height: 140px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); padding: 20px; display: grid; align-content: start; gap: 10px; }
.gcard i { display: block; height: 10px; border-radius: 6px; background: var(--surface-3); }
.gcard i:first-child { width: 36%; height: 13px; background: color-mix(in srgb, var(--text) 20%, transparent); }
.gcard i:nth-child(2) { width: 82%; } .gcard i:nth-child(3) { width: 60%; }
.gcard.w2 { grid-column: span 2; } .gcard.w3 { grid-column: 1 / -1; } .gcard.t { min-height: 296px; grid-row: span 2; }
.pane { animation: in .32s var(--ease); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }

/* ── A · 밑줄 탭 ── */
.a-head { margin-bottom: 24px; }
.a-head .kick { font-size: 13px; font-weight: 650; color: var(--text-3); margin-bottom: 4px; }
.a-head h3 { margin: 0 0 16px; font-size: 28px; letter-spacing: -.015em; }
.a-tabs { position: relative; display: flex; gap: 28px; border-bottom: 1px solid var(--line-2); }
.a-tabs button { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0; border: 0; background: none; font-size: 16px; font-weight: 650; color: var(--text-3); cursor: pointer; transition: color .2s; }
.a-tabs button:hover { color: var(--text-2); }
.a-tabs button.on { color: var(--text); }
.a-tabs .cnt { font-size: 12px; font-weight: 700; color: var(--text-3); font-variant-numeric: tabular-nums; }
.a-tabs .cnt.hot { color: var(--gold); }
.a-ink { position: absolute; bottom: -1px; height: 2px; border-radius: 2px; background: var(--text); transition: left .38s var(--ease), width .38s var(--ease); }

/* ── B · 사이드바 펼침 ── */
.b-sub { display: grid; overflow: hidden; grid-template-rows: 0fr; transition: grid-template-rows .36s var(--ease); }
.b-sub.open { grid-template-rows: 1fr; }
.b-sub > div { min-height: 0; position: relative; padding-left: 21px; }
.b-sub > div::before { content: ''; position: absolute; left: 21px; top: 4px; bottom: 4px; width: 1px; background: var(--line-2); }
.b-sub button { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; margin: 2px 0; padding: 0 12px 0 23px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 14px; font-weight: 600; color: var(--text-3); cursor: pointer; transition: color .15s, background-color .15s; }
.b-sub button:hover { color: var(--text); background: var(--surface-2); }
.b-sub button.on { color: var(--text); font-weight: 700; }
.b-sub button.on::before { content: ''; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); }
.b-sub .dot { margin-left: auto; width: 6px; height: 6px; }
.b-sub .cnt { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--gold); }
.b-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; }
.b-head h3 { margin: 0; font-size: 28px; letter-spacing: -.015em; }
.b-head span { font-size: 13px; color: var(--text-3); }
.b-narrow { display: none; margin: -8px 0 24px; }
@media (max-width: 900px) { .b-narrow { display: flex; } }

/* ── C · 떠 있는 고르기 탭 ── */
.c-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.c-head h3 { margin: 0; font-size: 28px; letter-spacing: -.015em; }
.c-head .sub { margin-top: 2px; font-size: 13px; color: var(--text-3); }
.c-seg { position: relative; display: inline-flex; padding: 4px; border-radius: 999px; background: var(--track); border: 1px solid var(--line); box-shadow: inset 0 1px 2px rgba(0,0,0,.04); }
.c-seg button { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: none; font-weight: 650; color: var(--text-2); cursor: pointer; transition: color .2s; white-space: nowrap; }
.c-seg button svg { width: 16px; height: 16px; opacity: .7; }
.c-seg button.on { color: var(--text); }
.c-seg button.on svg { opacity: 1; color: var(--accent); }
.c-seg .cnt { min-width: 18px; height: 18px; padding: 0 6px; border-radius: 999px; background: var(--gold); color: #1a1405; font-size: 12px; font-weight: 800; display: inline-grid; place-items: center; line-height: 1; }
.c-seg .dot { width: 6px; height: 6px; }
.c-thumb { position: absolute; top: 4px; bottom: 4px; border-radius: 999px; background: var(--thumb); box-shadow: 0 1px 2px rgba(16,20,36,.08), 0 4px 12px rgba(16,20,36,.08), inset 0 1px 0 rgba(255,255,255,.08); transition: left .4s var(--ease), width .4s var(--ease); }

@media (prefers-reduced-motion: reduce) { .a-ink, .c-thumb, .b-sub, .item .chev { transition: none; } .pane { animation: none; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 64px minmax(0, 1fr); }
  .app .glabel, .app .brand span, .app .item span, .app .item .chev, .b-sub { display: none; }
  .app .item { justify-content: center; padding: 0; }
  .app .item .dot { position: absolute; top: 6px; right: 6px; margin: 0; }
  .main { padding: 20px 16px; }
  .ghost { grid-template-columns: 1fr 1fr; }
  .a-tabs { gap: 20px; }
  .c-seg button { padding: 0 12px; }
  .c-seg button span.lbl-i { display: none; }
}
@media (max-width: 560px) {
  #optSeg { width: 100%; } #optSeg button { flex: 1; } #optSeg .long { display: none; }
  .note { grid-template-columns: 1fr; }
  .ghost { grid-template-columns: 1fr; }
  .gcard.w2, .gcard.t { grid-column: auto; grid-row: auto; min-height: 140px; }
  .c-head { flex-direction: column; align-items: stretch; }
  .c-seg { width: 100%; } .c-seg button { flex: 1; justify-content: center; }
  .c-seg button svg { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>허브 탭 디자인 시안</h1>
  <p class="lead">메뉴 묶음(성장 = 도감·미션·랭킹, 멤버 = 멤버·소식·초대)은 그대로 두고, 그 안의 탭을 보여 주는 방식만 다시 만들었습니다. 세 시안 모두 탭은 한 곳에만 두고, 메뉴로 보이지 내용 카드로 보이지 않게 했습니다. 사이드바·탭을 눌러 보세요.</p>
  <div class="bar">
    <div class="seg" id="optSeg">
      <button data-opt="A">A<span class="long"> · 밑줄 탭</span></button>
      <button data-opt="B">B<span class="long"> · 사이드바 펼침</span></button>
      <button data-opt="C" class="on">C<span class="long"> · 떠 있는 고르기 탭</span></button>
    </div>
    <span class="sp"></span>
    <div class="seg" id="themeSeg">
      <button data-theme="" class="on">시스템</button>
      <button data-theme="light">라이트</button>
      <button data-theme="dark">다크</button>
    </div>
  </div>
  <div class="note" id="note"></div>
  <div id="stage"></div>
</div>
<script>
const I = {
  game: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  sprout: '<path d="M12 21v-8.5"/><path d="M12 12.5C12 8.6 9.2 6.5 5 6.5c0 3.9 2.8 6 7 6zM12 10.5c0-3.9 2.8-6 7-6 0 3.9-2.8 6-7 6z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  shield: '<path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5V6z"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8 21h8M9 17h6"/>',
  mega: '<path d="M3 10v4a1 1 0 0 0 1 1h3l6 4V5L7 9H4a1 1 0 0 0-1 1z"/><path d="M17 8a5 5 0 0 1 0 8"/>',
  gift: '<rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5V20h14v-7.5M12 8.5V20"/><path d="M12 8.5C10.5 5 7 4.5 7 6.6c0 1.6 2.4 1.9 5 1.9M12 8.5c1.5-3.5 5-4 5-1.9 0 1.6-2.4 1.9-5 1.9"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
};
const ic = (n, c = '') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const gem = '<svg width="24" height="26" viewBox="0 0 24 26"><defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1fc8ff"/><stop offset=".5" stop-color="#3d6bff"/><stop offset="1" stop-color="#b042ff"/></linearGradient></defs><path d="M12 1l10 6v12l-10 6L2 19V7z" fill="url(#gm)"/><path d="M12 1l10 6-10 6L2 7z" fill="#fff" opacity=".35"/></svg>';

const HUBS = {
  '성장': { icon: 'sprout', tabs: [['도감', 'book', '', '만난 챔프·증강·아이템'], ['미션', 'target', '2', '이번 주 미션·도전'], ['랭킹', 'trophy', '', '시즌 4 · Prism 점수']] },
  '멤버': { icon: 'users', tabs: [['멤버', 'users', '', '지금 접속 · NOW · 아카이브'], ['소식', 'mega', 'dot', '공지·이벤트·업데이트'], ['초대', 'gift', '', '친구 한 명마다 300 피스']] },
};
const LAYOUT = { '도감': ['w3', 't', 'w2', ''], '미션': ['w3', '', '', ''], '랭킹': ['w3', '', '', '', ''], '멤버': ['w3', 'w2', '', 'w3'], '소식': ['w3', 'w3'], '초대': ['w3', '', 'w2'], '분석': ['w2', '', 't', '', ''], '챔프': ['', '', '', '', '', ''], '증강': ['', '', '', '', '', ''], '운영': ['w3', '', '', ''] };
const NOTES = {
  A: ['A · 밑줄 탭', '제목 아래 글자 탭 한 줄. 고른 탭 밑의 선이 미끄러져 옮겨 갑니다. 가장 조용하고 내용이 바로 위로 올라옵니다. 미션 받을 보상 수·새 소식 점만 작게.', '탭이 작아 처음엔 덜 눈에 띌 수 있어요.'],
  B: ['B · 사이드바 펼침', '탭을 화면이 아니라 사이드바에 둡니다. 성장·멤버를 누르면 그 아래로 세로선과 함께 펼쳐지고, 고른 줄에 파란 막대. 화면에는 제목만. (좁은 사이드바·웹 휴대폰은 화면 위 밑줄 탭으로)', '메뉴가 펼쳐지면 사이드바가 길어져요.'],
  C: ['C · 떠 있는 고르기 탭', '제목 오른쪽에 둥근 고르기 탭(아이콘 + 이름). 고른 칸의 바탕이 미끄러져 옮겨 가고, 받을 보상은 금빛 숫자. 탭이 한눈에 보이면서도 내용 카드와 모양이 달라 헷갈리지 않습니다.', ''],
};
let opt = 'C', page = '미션';
const hubOf = (p) => Object.keys(HUBS).find((h) => HUBS[h].tabs.some((t) => t[0] === p));

function sidebar() {
  const g1 = [['분석', 'game'], ['챔프', 'grid'], ['증강', 'spark']];
  const row = ([n, i]) => `<button class="item ${page === n ? 'on' : ''}" data-go="${n}">${ic(i)}<span>${n}</span></button>`;
  const hubRow = (h) => {
    const on = hubOf(page) === h;
    const hasDot = HUBS[h].tabs.some((t) => t[2] === 'dot');
    let extra = '';
    if (opt === 'B') {
      extra = `<div class="b-sub ${on ? 'open' : ''}"><div>${HUBS[h].tabs.map(([n, , b]) => `<button class="${page === n ? 'on' : ''}" data-go="${n}">${n}${b === 'dot' ? '<i class="dot"></i>' : b ? `<span class="cnt">${b}</span>` : ''}</button>`).join('')}</div></div>`;
    }
    const tail = opt === 'B' ? ic('chev', 'chev') : (hasDot ? '<i class="dot"></i>' : '');
    return `<div><button class="item ${on ? 'on' : ''} ${opt === 'B' && on ? 'open' : ''}" data-hub="${h}">${ic(HUBS[h].icon)}<span>${h}</span>${tail}</button>${extra}</div>`;
  };
  return `<aside class="side"><div class="brand">${gem}<span>PRISM</span></div><nav class="nav"><div class="group"><div class="glabel">게임</div>${g1.map(row).join('')}</div><div class="group"><div class="glabel">성장 · 모임</div>${hubRow('성장')}${hubRow('멤버')}${row(['운영', 'shield'])}</div></nav></aside>`;
}

function body() {
  const hub = hubOf(page);
  const cards = (LAYOUT[page] || ['', '', '']).map((c) => `<div class="gcard ${c}"><i></i><i></i><i></i></div>`).join('');
  if (!hub) return `<div class="b-head"><h3>${page}</h3></div><div class="ghost pane">${cards}</div>`;
  const tabs = HUBS[hub].tabs;
  const cur = tabs.find((t) => t[0] === page);
  if (opt === 'A') {
    return `<div class="a-head"><div class="kick">${hub}</div><h3>${page}</h3><div class="a-tabs">${tabs.map(([n, , b]) => `<button class="${n === page ? 'on' : ''}" data-go="${n}">${n}${b === 'dot' ? '<i class="dot" style="width:6px;height:6px"></i>' : b ? `<span class="cnt hot">${b}</span>` : ''}</button>`).join('')}<span class="a-ink"></span></div></div><div class="ghost pane">${cards}</div>`;
  }
  if (opt === 'B') {
    return `<div class="b-head"><h3>${page}</h3><span>${cur[3]}</span></div><div class="a-tabs b-narrow">${tabs.map(([n, , b]) => `<button class="${n === page ? 'on' : ''}" data-go="${n}">${n}${b === 'dot' ? '<i class="dot" style="width:6px;height:6px"></i>' : b ? `<span class="cnt hot">${b}</span>` : ''}</button>`).join('')}<span class="a-ink"></span></div><div class="ghost pane">${cards}</div>`;
  }
  return `<div class="c-head"><div><h3>${page}</h3><div class="sub">${cur[3]}</div></div><div class="c-seg"><span class="c-thumb"></span>${tabs.map(([n, i, b]) => `<button class="${n === page ? 'on' : ''}" data-go="${n}">${ic(i)}<span>${n}</span>${b === 'dot' ? '<i class="dot"></i>' : b ? `<span class="cnt">${b}</span>` : ''}</button>`).join('')}</div></div><div class="ghost pane">${cards}</div>`;
}

let prevInk = null;
function place(sel, onSel, cls) {
  const box = document.querySelector(sel); if (!box) return;
  const on = box.querySelector(onSel); const ink = box.querySelector(cls); if (!on || !ink) return;
  const set = () => { ink.style.left = on.offsetLeft + 'px'; ink.style.width = on.offsetWidth + 'px'; };
  // 이전 위치에서 미끄러지도록: 먼저 이전 값, 다음 프레임에 새 값
  if (prevInk) { ink.style.transition = 'none'; ink.style.left = prevInk[0] + 'px'; ink.style.width = prevInk[1] + 'px'; ink.offsetWidth; ink.style.transition = ''; }
  requestAnimationFrame(set);
  prevInk = [on.offsetLeft, on.offsetWidth];
}

function render(keepPane) {
  document.querySelectorAll('#optSeg button').forEach((b) => b.classList.toggle('on', b.dataset.opt === opt));
  const [t, d, c] = NOTES[opt];
  document.getElementById('note').innerHTML = `<div><h2>${t}${opt === 'C' ? '<span class="rec">추천</span>' : ''}</h2><p>${d}</p>${c ? `<p style="margin-top:4px;color:var(--text-3)">아쉬운 점 · ${c}</p>` : ''}</div>`;
  document.getElementById('stage').innerHTML = `<div class="frame app">${sidebar()}<main class="main">${body()}</main></div>`;
  if (opt === 'A' || opt === 'B') place('.a-tabs', 'button.on', '.a-ink');
  if (opt === 'C') place('.c-seg', 'button.on', '.c-thumb');
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.opt) { opt = b.dataset.opt; prevInk = null; render(); return; }
  if (b.closest('#themeSeg')) {
    if (b.dataset.theme) document.documentElement.dataset.theme = b.dataset.theme; else delete document.documentElement.dataset.theme;
    document.querySelectorAll('#themeSeg button').forEach((x) => x.classList.toggle('on', x === b)); return;
  }
  if (b.dataset.hub) { const h = b.dataset.hub; if (hubOf(page) !== h) { page = HUBS[h].tabs[0][0]; prevInk = null; } render(); return; }
  if (b.dataset.go) { const same = hubOf(page) && hubOf(page) === hubOf(b.dataset.go); if (!same) prevInk = null; page = b.dataset.go; render(); }
});
addEventListener('resize', () => { prevInk = null; if (opt === 'A') place('.a-tabs', 'button.on', '.a-ink'); if (opt === 'C') place('.c-seg', 'button.on', '.c-thumb'); });
render();
</script>
</body>
</html>
