<title>Prism 앱 홈 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 위 시안 고르기 → 앱 창(왼쪽 사이드바 + 홈) 하나에 시안 A·B·C 를 갈아 끼운다. Prism 토큰 그대로 */
:root{
  --bg:#f3f4f8; --panel:#fff; --panel2:#f6f7fb; --line:#e6e8f0; --fg:#12141c; --fg2:#4a4f61; --mut:#848a9c;
  --acc:#3b5bfd; --acc-soft:#e9edff; --win:#2563eb; --lose:#e5484d; --gold:#c08a12; --silver:#8b93a5;
  --tierS:#5b5bf0; --tierA:#c9cdfb; --tierAfg:#3d3fb8; --side:#fbfbfd; --mark:rgba(59,91,253,.16);
  --stage:#0b0e18;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07090f; --panel:#10141f; --panel2:#151a27; --line:#222839; --fg:#eef0f6; --fg2:#b4b9c8; --mut:#7d8497;
  --acc:#6d86ff; --acc-soft:#1b2348; --win:#5b8cff; --lose:#ff6b70; --gold:#e3b341; --silver:#a3abbd;
  --tierS:#6d6dff; --tierA:#2b2f63; --tierAfg:#b9bcff; --side:#0c0f18; --mark:rgba(109,134,255,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07090f; --panel:#10141f; --panel2:#151a27; --line:#222839; --fg:#eef0f6; --fg2:#b4b9c8; --mut:#7d8497;
  --acc:#6d86ff; --acc-soft:#1b2348; --win:#5b8cff; --lose:#ff6b70; --gold:#e3b341; --silver:#a3abbd;
  --tierS:#6d6dff; --tierA:#2b2f63; --tierAfg:#b9bcff; --side:#0c0f18; --mark:rgba(109,134,255,.22); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:16px}

/* 시안 고르기 */
.pick{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pick h1{font-size:20px;font-weight:800}
.pick p{color:var(--mut);font-size:13px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.why div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.why b{display:block;font-size:13px;margin-bottom:4px}
.why span{color:var(--fg2);font-size:13px}

/* 앱 창 */
.app{display:grid;grid-template-columns:200px minmax(0,1fr);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--bg);box-shadow:0 12px 40px rgba(10,14,30,.08)}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.1em;font-size:16px;padding:0 4px}
.brand i{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 200deg,#ff5d8f,#ffb547,#5be0c8,#5b8cff,#b46bff,#ff5d8f);clip-path:polygon(50% 0,100% 30%,82% 100%,18% 100%,0 30%)}
.grp{display:grid;gap:2px}
.grp small{font-size:12px;color:var(--mut);padding:0 8px 4px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--fg2);font-weight:600;font-size:14px}
.nav svg{width:18px;height:18px;flex:none}
.nav.on{background:var(--acc-soft);color:var(--acc)}
.nav .new{margin-left:auto;font-size:12px;font-weight:800;color:var(--acc)}
.sme{margin-top:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.sme img{width:48px;height:48px;object-fit:cover}
.sme b{font-size:13px;display:block}
.sme span{font-size:12px;color:var(--mut)}
.main{min-width:0;padding:24px;display:grid;gap:16px;align-content:start}

/* 공용 조각 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.ch h3{font-size:16px;font-weight:800}
.ch a{font-size:13px;color:var(--mut);text-decoration:none;font-weight:600}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--mut)}
.face{border-radius:12px;object-fit:cover;flex:none;display:block}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--fg2);white-space:nowrap}
.tier{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:800;font-size:13px;flex:none}
.tier.S{background:var(--tierS);color:#fff}
.tier.A{background:var(--tierA);color:var(--tierAfg)}
.ring{width:40px;height:40px;border-radius:50%;padding:3px;flex:none;background:var(--silver)}
.ring.prism{background:conic-gradient(#ff5d8f,#ffb547,#5be0c8,#5b8cff,#b46bff,#ff5d8f)}
.ring.gold{background:var(--gold)}
.ring img{width:100%;height:100%;border-radius:50%;display:block;background:#141826}
.aug{display:flex;align-items:center;gap:10px;min-width:0}
.aug b{font-size:14px;font-weight:700;min-width:0;flex:1}
.aug small{color:var(--mut);font-size:12px;white-space:nowrap}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:2px;background:var(--win)}
.dots i.l{background:var(--lose)}
.gem{display:inline-block;width:12px;height:12px;background:conic-gradient(#ff5d8f,#ffb547,#5be0c8,#5b8cff,#b46bff,#ff5d8f);clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%)}

/* 큰 검색바 */
.search{position:relative;display:flex;align-items:center;gap:12px;height:64px;padding:0 12px 0 20px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);box-shadow:0 8px 28px rgba(10,14,30,.08)}
.search svg{width:22px;height:22px;color:var(--mut);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:20px;font-weight:600;color:var(--fg);outline:none}
.search input::placeholder{color:var(--mut);font-weight:500}
.search kbd{font:inherit;font-size:12px;font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 8px;flex:none}
.scope{display:flex;gap:8px;flex-wrap:wrap}
.scope button{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px;color:var(--fg2)}
.scope button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* 검색 결과 판 (열린 모습) */
.drop{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 48px rgba(10,14,30,.16);padding:8px;display:grid;gap:4px}
.drop h4{margin:8px 12px 4px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;min-width:0}
.row.sel{background:var(--acc-soft)}
.row .t{min-width:0;flex:1}
.row .t b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:12px;color:var(--mut)}
.row mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.row .tag{font-size:12px;color:var(--mut);white-space:nowrap}
.drop .foot{display:flex;gap:16px;justify-content:flex-end;padding:8px 12px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}

/* 오늘의 챔프 무대 (공용) */
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--stage);color:#fff;isolation:isolate}
.stage .bg{position:absolute;inset:0;background-size:cover;background-position:60% 30%;z-index:-2}
.stage::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,8,16,.94) 0%,rgba(6,8,16,.74) 42%,rgba(6,8,16,.15) 100%),linear-gradient(0deg,rgba(6,8,16,.85),transparent 55%)}
.stage .eyebrow{color:rgba(255,255,255,.72)}
.stage h2{font-size:56px;line-height:1.05;font-weight:850;letter-spacing:-.01em}
.stage .tags{display:flex;gap:8px;flex-wrap:wrap}
.stage .tags span{height:28px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;font-size:13px;font-weight:700}
.stage .stat{display:flex;gap:24px;flex-wrap:wrap}
.stage .stat div b{display:block;font-size:20px;font-weight:800}
.stage .stat div span{font-size:12px;color:rgba(255,255,255,.66)}
.glass{white-space:nowrap;flex:none;height:32px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:#fff;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.glass svg{width:16px;height:16px}
.cta{height:44px;padding:0 20px;border-radius:999px;background:var(--acc);color:#fff;font-weight:800;display:inline-flex;align-items:center;gap:8px}

/* 랭킹 맛보기 (공용) */
.rk{display:grid;gap:6px}
.rk .r{display:grid;grid-template-columns:28px 36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 8px;border-radius:10px}
.rk .r .n{font-weight:800;font-size:14px;text-align:center}
.rk .r b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .r small{font-size:12px;color:var(--mut);display:block}
.rk .r .s{font-weight:800;font-size:14px}
.rk .r.me{background:var(--acc-soft)}
.rk .r.me .n{color:var(--acc)}
.rk .blur{filter:blur(5px);opacity:.6;pointer-events:none;user-select:none}
.rk .gap{height:14px;display:grid;place-items:center;color:var(--mut);font-size:12px;letter-spacing:.3em}

/* ===== 시안 A — 무대 위 검색 ===== */
.A .stage{min-height:420px;padding:40px 40px 32px;display:grid;align-content:space-between;gap:24px}
.A .stage .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.A .hello{font-size:16px;font-weight:700;color:rgba(255,255,255,.86)}
.A .champ{display:grid;gap:12px;max-width:560px}
.A .stage>*{min-width:0}
.A .search{width:100%;background:rgba(255,255,255,.96);border-color:transparent;max-width:760px}
.A .search input{color:#12141c}
.A .search kbd{border-color:#dfe2ea;color:#7d8497}
.A .scope{margin-top:12px}
.A .scope button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.A .scope button.on{background:#fff;color:#12141c;border-color:#fff}
.A .grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.A .augs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.A .augs>div{padding:16px;display:grid;gap:12px;align-content:start;border-right:1px solid var(--line);min-width:0}
.A .augs>div:last-child{border-right:0}
.A .augs h4{margin:0;font-size:13px;font-weight:800}
.A .podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin-bottom:12px}
.A .pod{display:grid;justify-items:center;gap:6px;text-align:center}
.A .pod img{width:52px;height:52px;border-radius:14px;object-fit:cover}
.A .pod.p1 img{width:64px;height:64px;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--gold)}
.A .pod b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.A .pod .base{width:100%;border-radius:10px 10px 4px 4px;background:var(--panel2);display:grid;place-items:center;font-weight:800;color:var(--fg2)}
.A .pod.p1 .base{height:56px;background:linear-gradient(180deg,rgba(227,179,65,.28),var(--panel2))}
.A .pod.p2 .base{height:40px}
.A .pod.p3 .base{height:28px}
.A .strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.A .strip .card{display:grid;gap:6px;padding:14px 16px}
.A .strip b{font-size:20px;font-weight:800}
.A .strip span{font-size:12px;color:var(--mut)}

/* ===== 시안 B — 검색이 먼저 (스포트라이트) ===== */
.B .head{display:grid;gap:12px;justify-items:center;text-align:center;padding:24px 0 8px}
.B .head h2{font-size:28px;font-weight:800}
.B .head p{color:var(--mut)}
.B .sbox{width:min(820px,100%);position:relative;display:grid;gap:12px;justify-items:center}
.B .search{width:100%;height:72px;border-color:var(--acc);box-shadow:0 0 0 4px var(--mark),0 12px 32px rgba(10,14,30,.1)}
.B .search input{font-size:22px}
.B .sq{position:relative;width:100%}
.B .drop{text-align:left}
.B .spacer{height:356px}
.B .grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.B .stage{min-height:300px;padding:28px;display:grid;align-content:end;gap:12px}
.B .stage h2{font-size:40px}
.B .stage .shuf{position:absolute;top:16px;right:16px}
.B .augrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.B .augrow .card{display:grid;gap:10px;padding:14px}
.B .augrow h4{margin:0;font-size:12px;font-weight:800}

/* ===== 시안 C — 벤토 ===== */
.C .bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.C .bar .search{height:60px}
.C .recent{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.C .recent .eyebrow{margin-right:4px}
.C .recent button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700}
.C .recent button img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.C .recent button.txt{padding-left:12px}
.C .bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);gap:16px}
.C .big{grid-column:span 2;grid-row:span 2;padding:28px;display:grid;align-content:space-between;gap:16px;min-height:360px}
.C .big h2{font-size:48px}
.C .mini-augs{display:grid;gap:8px;background:rgba(8,10,20,.55);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}
.C .mini-augs .aug b{color:#fff}
.C .mini-augs .aug small{color:rgba(255,255,255,.6)}
.C .rank{grid-column:span 2;grid-row:span 2}
.C .tile{display:grid;gap:8px;align-content:start}
.C .tile .big-n{font-size:28px;font-weight:800;line-height:1.1}
.C .bar2{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden}
.C .bar2 i{display:block;height:100%;background:var(--acc);border-radius:inherit}
.C .live{display:grid;gap:8px}
.C .live .row{padding:4px 0}
.C .pdot{width:8px;height:8px;border-radius:50%;background:#22a35a;box-shadow:0 0 0 3px rgba(34,163,90,.18);flex:none}
.C .wide{grid-column:span 2}
.C .lb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.C .lbc{position:relative;border-radius:14px;overflow:hidden;background:var(--stage);color:#fff;padding:12px;display:grid;justify-items:center;gap:6px;text-align:center;isolation:isolate}
.C .lbc img.f{width:56px;height:56px;border-radius:14px;object-fit:cover}
.C .lbc .n{position:absolute;top:8px;left:10px;font-weight:800;font-size:13px;color:rgba(255,255,255,.8)}
.C .lbc b{font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.C .lbc span{font-size:12px;color:rgba(255,255,255,.7)}
.C .lbc.p1{box-shadow:inset 0 0 0 1.5px rgba(227,179,65,.7)}
.C .lbc.p1 .n{color:#f3c862}

.note{font-size:12px;color:var(--mut);text-align:center}

@media (max-width:1100px){
  .A .grid,.B .grid{grid-template-columns:1fr}
  .C .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .A .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px}
  .stage h2,.A .stage h2{font-size:40px}
  .A .stage{padding:24px}
  .A .augs,.B .augrow{grid-template-columns:1fr}
  .A .augs>div{border-right:0;border-bottom:1px solid var(--line)}
  .C .bento{grid-template-columns:1fr}
  .C .big,.C .rank,.C .wide{grid-column:auto;grid-row:auto}
  .C .bar{grid-template-columns:1fr}
  .search kbd{display:none}
  .search input{font-size:16px}
  .B .search input{font-size:17px}
  .B .spacer{height:420px}
}
@media (prefers-reduced-motion:no-preference){
  .stage .bg{animation:drift 30s ease-in-out infinite alternate}
  @keyframes drift{to{transform:scale(1.06)}}
}
</style>

<div class="wrap">
  <div class="pick">
    <div><h1>앱 홈 시안 3개</h1><p>지금의 '분석' 대신 앱을 켜면 처음 보는 화면. 큰 검색 · 오늘의 챔프 · 랭킹 맛보기</p></div>
    <div class="seg" role="group" aria-label="시안 고르기">
      <button id="bA" aria-pressed="true" data-v="A">A · 무대 위 검색</button>
      <button id="bB" aria-pressed="false" data-v="B">B · 검색이 먼저</button>
      <button id="bC" aria-pressed="false" data-v="C">C · 벤토</button>
    </div>
  </div>
  <div class="why" id="why"></div>

  <div class="app">
    <aside class="side" aria-label="사이드바">
      <div class="brand"><i></i>PRISM</div>
      <div class="grp"><small>게임</small>
        <span class="nav on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</span>
        <span class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>분석</span>
        <span class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>챔프</span>
        <span class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>증강</span>
      </div>
      <div class="grp"><small>성장 · 모임</small>
        <span class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>성장</span>

<script>
const WHY = {
  A:[["처음 보는 것","오늘의 챔프 무대가 화면 위를 크게 차지하고, 그 무대 안에 큰 검색바가 놓여요."],["좋은 점","분위기가 가장 강해요. 지금 '이 챔프 어때요?' 배너를 넓힌 모양이라 낯설지 않아요."],["아쉬운 점","검색은 무대 아래쪽에 있어 '검색하러 왔다'는 사람에겐 한 박자 늦을 수 있어요."]],
  B:[["처음 보는 것","화면 가운데 아주 큰 검색바. 누르면 멤버·챔프·증강·도감 결과가 바로 펼쳐져요 (열린 모습)."],["좋은 점","전적 검색이 주인공이에요. 키보드만으로 찾고 열 수 있어요."],["아쉬운 점","오늘의 챔프는 검색 아래 두 번째 자리로 내려가요."]],
  C:[["처음 보는 것","맨 위 검색 막대 + 최근 검색, 아래는 크기가 다른 칸들(오늘의 챔프·랭킹·지금 게임 중·미션·최근 판)."],["좋은 점","한눈에 가장 많은 정보. 랭킹 무대·지금 게임 중을 같이 보여 매일 열어 볼 이유가 커요."],["아쉬운 점","칸이 많아 첫인상은 A보다 덜 극적이에요."]]
};
const main = document.getElementById('main'), why = document.getElementById('why');
function show(v){
  main.replaceChildren(document.getElementById('t'+v).content.cloneNode(true));
  why.innerHTML = WHY[v].map(([b,s])=>`<div><b>${b}</b><span>${s}</span></div>`).join('');
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===v)));
  try{ localStorage.setItem('prism-home-mock', v) }catch(e){}
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
let first='A'; try{ first = localStorage.getItem('prism-home-mock') || 'A' }catch(e){}
show(['A','B','C'].includes(first)?first:'A');
document.addEventListener('keydown',e=>{ if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ const q=main.querySelector('input'); if(q){e.preventDefault();q.focus()} } });
</script>
